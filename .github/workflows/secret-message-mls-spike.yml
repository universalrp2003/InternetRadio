name: Secret Message MLS integration spike

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "secretmessage/native/**"
      - ".github/workflows/secret-message-mls-spike.yml"
  pull_request:
    paths:
      - "secretmessage/native/**"
      - ".github/workflows/secret-message-mls-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-message-mls-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_API_LEVEL: "26"

jobs:
  openmls-feasibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Rust 1.91.0 and Android targets
        id: setup_rust
        continue-on-error: true
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Bootstrap the lockfile once, then keep builds locked
        id: bootstrap
        continue-on-error: true
        working-directory: secretmessage/native
        run: |
          if [[ ! -f Cargo.lock ]]; then
            cargo generate-lockfile
          fi
          cargo metadata --locked --format-version 1 > /dev/null
          rustc --version --verbose
          cargo --version

      - name: Format Rust source and report formatter changes
        id: format
        continue-on-error: true
        working-directory: secretmessage/native
        run: |
          cargo fmt
          if ! git diff --quiet -- src/lib.rs; then
            git diff -- src/lib.rs > "$RUNNER_TEMP/secretmessage-rustfmt.patch"
            {
              echo '## rustfmt changes (apply these to the source checkout)'
              echo '```diff'
              cat "$RUNNER_TEMP/secretmessage-rustfmt.patch"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 - "$RUNNER_TEMP/secretmessage-rustfmt.patch" <<'PY'
          import base64
          import pathlib
          import sys
          encoded = base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode("ascii")
          for index, start in enumerate(range(0, len(encoded), 3000), 1):
              print(f"::notice title=Rustfmt-patch-{index:03d}::{encoded[start:start + 3000]}")
          PY
          fi
          cargo fmt -- --check

      - name: Run the in-memory two-party exchange test
        id: mls_test
        continue-on-error: true
        working-directory: secretmessage/native
        run: |
          set +e
          cargo test --locked --features spike-harness 2>&1 | tee "$RUNNER_TEMP/secretmessage-mls-test.log"
          result=${PIPESTATUS[0]}
          {
            echo '## Host test output (last 120 lines)'
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/secretmessage-mls-test.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( result != 0 )); then
            details="$(tail -n 35 "$RUNNER_TEMP/secretmessage-mls-test.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Cargo-test-diagnostics::$details"
          fi
          exit "$result"

      - name: Run Clippy with warnings denied
        id: clippy
        continue-on-error: true
        working-directory: secretmessage/native
        run: |
          set +e
          cargo clippy --locked --all-targets --features spike-harness -- -D warnings 2>&1 | tee "$RUNNER_TEMP/secretmessage-mls-clippy.log"
          result=${PIPESTATUS[0]}
          {
            echo '## Clippy output (last 120 lines)'
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/secretmessage-mls-clippy.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( result != 0 )); then
            details="$(tail -n 35 "$RUNNER_TEMP/secretmessage-mls-clippy.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Cargo-clippy-diagnostics::$details"
          fi
          exit "$result"

      - name: Inspect each active Android dependency graph
        id: dependency_graph
        continue-on-error: true
        working-directory: secretmessage/native
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/secretmessage-mls-android-dependencies.txt"
          : > "$report"
          for target in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            echo "===== $target =====" | tee -a "$report"
            if ! cargo tree --locked --target "$target" --edges normal,build --prefix none --format '{p}' 2>&1 \
              | sort -u | tee -a "$report"; then
              details="$(tail -n 35 "$report")"
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=Android-dependency-tree-diagnostics::$details"
              exit 1
            fi
          done
          expected_libcrux="$(grep -Ei '^libcrux-(intrinsics|platform|secrets|sha3|traits) v' "$report" | sort -u || true)"
          unexpected_libcrux="$(grep -i 'libcrux' "$report" | grep -Ev '^libcrux-(intrinsics|platform|secrets|sha3|traits) v' || true)"
          if [[ -n "$expected_libcrux" ]]; then
            echo "::warning title=Transitive-Libcrux-SHA3-review-required::The active RustCrypto candidate graph includes libcrux-sha3 support crates through hpke-rs; this is not the Libcrux provider and remains subject to RustSec and license review."
            {
              echo '## Observed transitive Libcrux SHA3 support crates'
              echo 'The active Android normal/build graph contains the following packages through the RustCrypto candidate dependency chain. This is not treated as cleared: the RustSec audit and license inventory still cover the resolved lockfile.'
              echo '```text'
              printf '%s\n' "$expected_libcrux"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            paths="$RUNNER_TEMP/secretmessage-mls-libcrux-inverse.txt"
            : > "$paths"
            echo '===== aarch64-linux-android: inverse normal/build path to libcrux-sha3 =====' | tee -a "$paths"
            cargo tree --locked --target aarch64-linux-android --edges normal,build --invert libcrux-sha3 2>&1 | tee -a "$paths"
            echo '===== aarch64-linux-android: feature path to libcrux-sha3 =====' | tee -a "$paths"
            cargo tree --locked --target aarch64-linux-android --edges normal,build,features --invert libcrux-sha3 2>&1 | tee -a "$paths"
            {
              echo '### Inverse dependency and feature paths'
              echo '```text'
              cat "$paths"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - "$report" <<'PY'
          import base64
          import zlib
          from pathlib import Path
          import sys
          encoded = base64.b64encode(zlib.compress(Path(sys.argv[1]).read_bytes(), level=9)).decode("ascii")
          for index, start in enumerate(range(0, len(encoded), 3000), 1):
              print(f"::notice title=Android-dependency-graph-{index:03d}::{encoded[start:start + 3000]}")
          PY
          if [[ -n "$unexpected_libcrux" ]]; then
            details="$unexpected_libcrux"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Unexpected-Libcrux-provider-in-active-graph::$details"
            exit 1
          fi

      - name: Set up Android SDK and pinned NDK
        id: android_sdk
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.ANDROID_NDK_VERSION }}
        id: install_ndk
        continue-on-error: true
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cross-compile and link the OpenMLS spike for all Android ABIs
        id: android_build
        continue-on-error: true
        working-directory: secretmessage/native
        run: |
          set +e
          bash build-android.sh 2>&1 | tee "$RUNNER_TEMP/secretmessage-mls-android-build.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            details="$(tail -n 35 "$RUNNER_TEMP/secretmessage-mls-android-build.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Android-cross-build-diagnostics::$details"
          fi
          exit "$result"

      - name: Capture resolved lockfile and package-license metadata
        id: review_metadata
        if: always()
        continue-on-error: true
        working-directory: secretmessage/native
        run: |
          mkdir -p "$RUNNER_TEMP/secretmessage-mls-review"
          if [[ -f Cargo.lock ]]; then
            cp Cargo.lock "$RUNNER_TEMP/secretmessage-mls-review/Cargo.lock"
            {
              echo '## Resolved Cargo.lock (review output; commit the approved lockfile explicitly)'
              echo '```toml'
              cat Cargo.lock
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY'
          import base64
          import zlib
          from pathlib import Path
          compressed = zlib.compress(Path("Cargo.lock").read_bytes(), level=9)
          encoded = base64.b64encode(compressed).decode("ascii")
          for index, start in enumerate(range(0, len(encoded), 3000), 1):
              print(f"::notice title=Cargo-lock-z-{index:03d}::{encoded[start:start + 3000]}")
          PY
          fi
          cp Cargo.toml "$RUNNER_TEMP/secretmessage-mls-review/Cargo.toml"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/secretmessage-mls-review/cargo-metadata.json"
          python3 - "$RUNNER_TEMP/secretmessage-mls-review/cargo-metadata.json" "$RUNNER_TEMP/secretmessage-mls-review/licenses.tsv" <<'PY'
          import base64
          import json
          import sys
          import zlib
          from pathlib import Path
          metadata = json.loads(Path(sys.argv[1]).read_text())
          rows = ["name\tversion\tlicense\tsource"]
          for package in sorted(metadata["packages"], key=lambda item: (item["name"], item["version"])):
              license_value = package.get("license") or ("FILE:" + package["license_file"] if package.get("license_file") else "UNKNOWN")
              rows.append("\t".join((package["name"], package["version"], license_value, package.get("source") or "local")))
          report = "\n".join(rows) + "\n"
          Path(sys.argv[2]).write_text(report)
          encoded = base64.b64encode(zlib.compress(report.encode(), level=9)).decode("ascii")
          for index, start in enumerate(range(0, len(encoded), 3000), 1):
              print(f"::notice title=Rust-license-inventory-{index:03d}::{encoded[start:start + 3000]}")
          unknown_count = sum(row.endswith("\tUNKNOWN\tlocal") or "\tUNKNOWN\t" in row for row in rows[1:])
          print(f"::notice title=Rust-license-metadata-unknown::{unknown_count}")
          PY
          if [[ -f "$RUNNER_TEMP/secretmessage-mls-android-dependencies.txt" ]]; then
            cp "$RUNNER_TEMP/secretmessage-mls-android-dependencies.txt" "$RUNNER_TEMP/secretmessage-mls-review/"
          fi
          if [[ -f "$RUNNER_TEMP/secretmessage-mls-libcrux-inverse.txt" ]]; then
            cp "$RUNNER_TEMP/secretmessage-mls-libcrux-inverse.txt" "$RUNNER_TEMP/secretmessage-mls-review/"
          fi

      - name: Audit resolved Rust dependencies against RustSec
        id: rustsec_audit
        if: always()
        continue-on-error: true
        working-directory: secretmessage/native
        run: |
          set +e
          cargo install cargo-audit --locked 2>&1 | tee "$RUNNER_TEMP/cargo-audit-install.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            details="$(tail -n 35 "$RUNNER_TEMP/cargo-audit-install.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Cargo-audit-install-diagnostics::$details"
            exit "$result"
          fi
          cargo audit --version | tee "$RUNNER_TEMP/cargo-audit-version.log"
          cargo audit 2>&1 | tee "$RUNNER_TEMP/cargo-audit.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            details="$(tail -n 35 "$RUNNER_TEMP/cargo-audit.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=RustSec-audit-diagnostics::$details"
          fi
          exit "$result"

      - name: Upload review metadata (not APKs or native binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-message-mls-spike-dependency-review
          path: ${{ runner.temp }}/secretmessage-mls-review/
          if-no-files-found: warn
          retention-days: 14

      - name: Gate feasibility checks and report every outcome
        id: feasibility_gate
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          RUST_TOOLCHAIN: ${{ steps.setup_rust.outcome }}
          LOCKFILE: ${{ steps.bootstrap.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          MLS_TEST: ${{ steps.mls_test.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          DEPENDENCY_GRAPH: ${{ steps.dependency_graph.outcome }}
          ANDROID_SDK: ${{ steps.android_sdk.outcome }}
          NDK: ${{ steps.install_ndk.outcome }}
          ANDROID_BUILD: ${{ steps.android_build.outcome }}
          REVIEW_METADATA: ${{ steps.review_metadata.outcome }}
          RUSTSEC_AUDIT: ${{ steps.rustsec_audit.outcome }}
        run: |
          set -u
          failed=()
          {
            echo '## OpenMLS feasibility gate'
            echo '| Check | Outcome |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for check in \
            "Checkout=$CHECKOUT" \
            "Rust toolchain=$RUST_TOOLCHAIN" \
            "Lockfile and metadata=$LOCKFILE" \
            "Rust formatting=$FORMAT" \
            "Two-party MLS host test=$MLS_TEST" \
            "Clippy=$CLIPPY" \
            "Android dependency graph=$DEPENDENCY_GRAPH" \
            "Android SDK=$ANDROID_SDK" \
            "Android NDK=$NDK" \
            "Android ABI cross-build=$ANDROID_BUILD" \
            "Review metadata=$REVIEW_METADATA" \
            "RustSec audit=$RUSTSEC_AUDIT"; do
            name="${check%%=*}"
            outcome="${check#*=}"
            printf '| %s | %s |\n' "$name" "$outcome" >> "$GITHUB_STEP_SUMMARY"
            printf '%-34s %s\n' "$name" "$outcome"
            if [[ "$outcome" != 'success' ]]; then
              failed+=("$name: $outcome")
            fi
          done
          if ((${#failed[@]})); then
            echo '## Feasibility gate: BLOCKED' >> "$GITHUB_STEP_SUMMARY"
            printf 'Failed or incomplete checks:\n' >&2
            printf ' - %s\n' "${failed[@]}" >&2
            exit 1
          fi
          echo '## Feasibility gate: all required checks passed' >> "$GITHUB_STEP_SUMMARY"
