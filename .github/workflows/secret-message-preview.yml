# Test-only build of the local-only Secret Message preview (WhisperPad product screens).
# It never signs a release, never publishes, and fails if the merged APK gains a network or
# other unexpected permission. The uploaded debug APK is for owner device testing only.
name: Secret Message preview (debug, test only)

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "secretmessage/product/**"
      - "tools/tests/test_secretmessage_preview_contract.py"
      - ".github/workflows/secret-message-preview.yml"
  pull_request:
    paths:
      - "secretmessage/product/**"
      - "tools/tests/test_secretmessage_preview_contract.py"
      - ".github/workflows/secret-message-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-message-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-debug-apk:
    name: Build and check the local-only preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check preview source contracts
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tools/tests -p 'test_secretmessage_preview_contract.py' -v \
            > "$RUNNER_TEMP/preview-contract.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/preview-contract.log"
          if (( result != 0 )); then
            python3 - "$RUNNER_TEMP/preview-contract.log" secretmessage-preview-contract <<'PY'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title={sys.argv[2]}::{text}")
          PY
          fi
          exit "$result"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run preview unit tests, Android lint and debug build
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon \
            :secretmessage:testDebugUnitTest \
            :secretmessage:lintDebug \
            :secretmessage:assembleDebug 2>&1 | tee "$RUNNER_TEMP/preview-build.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            # Logs are not always downloadable outside GitHub, so surface the key lines as annotations.
            python3 - "$RUNNER_TEMP/preview-build.log" <<'PY'
          import glob
          import re
          import sys

          log = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          sections = []
          compile_errors = [line.replace("file:///home/runner/work/InternetRadio/InternetRadio/", "")
                            for line in log if line.startswith("e: ")]
          if compile_errors:
              sections.append(("compile", compile_errors[:60]))
          test_lines = []
          for index, line in enumerate(log):
              if re.search(r"\bFAILED$", line) and " > " in line:
                  test_lines.extend(log[index:index + 4])
          if test_lines:
              sections.append(("unit-tests", test_lines[:80]))
          lint_lines = []
          for report in sorted(glob.glob("secretmessage/product/build/**/lint-results-debug.txt", recursive=True)):
              content = open(report, encoding="utf-8", errors="replace").read().splitlines()
              for index, line in enumerate(content):
                  if ": Error:" in line or "Error:" in line[:12]:
                      lint_lines.extend(content[index:index + 3])
          if lint_lines:
              sections.append(("lint", lint_lines[:60]))
          wrong = []
          for index, line in enumerate(log):
              if line.startswith("* What went wrong") or "Could not resolve" in line or "Could not find" in line:
                  wrong.extend(log[index:index + 6])
          if wrong:
              sections.append(("gradle", wrong[:40]))
          sections.append(("tail", log[-25:]))
          emitted = 0
          for name, lines in sections:
              text = "\n".join(lines)
              for start in range(0, len(text), 3500):
                  if emitted >= 9:
                      break
                  chunk = text[start:start + 3500].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=secretmessage-preview-{name}::{chunk}")
                  emitted += 1
          PY
          fi
          exit "$result"

      - name: Summarize preview unit-test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob("secretmessage/product/build/test-results/testDebugUnitTest/*.xml"))
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          classes = []
          for report in reports:
              suite = ET.parse(report).getroot()
              counts = {key: int(suite.get(key, "0")) for key in totals}
              for key in totals:
                  totals[key] += counts[key]
              classes.append(f"{suite.get('name', '?').rsplit('.', 1)[-1]} {counts['tests']}")
          if not reports:
              print("::warning title=secretmessage-preview-unit-tests::No unit-test reports were produced.")
          else:
              print(
                  f"::notice title=secretmessage-preview-unit-tests::{totals['tests']} tests in {len(reports)} classes; "
                  f"{totals['failures']} failures, {totals['errors']} errors, {totals['skipped']} skipped. "
                  + "; ".join(classes)
              )
          PY

      - name: Verify the preview APK label, permissions and digest
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find secretmessage/product/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error title=secretmessage-preview-apk::Expected one preview debug APK, found ${#apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          if compgen -G "secretmessage/product/build/outputs/apk/release/*.apk" >/dev/null; then
            echo "::error title=secretmessage-preview-apk::The local preview must not produce a release APK"
            exit 1
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt2="$(ls "$sdk"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$aapt2" ]]; then
            echo "::error title=secretmessage-preview-apk::aapt2 was not found under $sdk/build-tools"
            exit 1
          fi
          aapt="$(dirname "$aapt2")/aapt"
          badging="$("$aapt2" dump badging "$apk")"
          if ! grep -Fq "application-label:'Secret Message Preview (NOT SECURE)'" <<<"$badging"; then
            echo "::error title=secretmessage-preview-apk::The preview APK is missing its NOT SECURE label"
            exit 1
          fi
          if ! grep -Fq "package: name='com.rpideas.secretmessage.preview'" <<<"$badging"; then
            echo "::error title=secretmessage-preview-apk::Unexpected preview package name"
            exit 1
          fi
          version="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -n 1)"
          permission_lines="$(grep '^uses-permission' <<<"$badging" || true)"
          if [[ -x "$aapt" ]]; then
            permission_lines+=$'\n'"$("$aapt" dump permissions "$apk" | grep '^uses-permission' || true)"
          fi
          permissions="$(grep -oE "[A-Za-z0-9_.]+\.[A-Z][A-Z0-9_]+" <<<"$permission_lines" | sort -u | tr '\n' ' ' | sed 's/ $//' || true)"
          echo "Merged preview permissions: ${permissions:-none}"
          allowed='^(android\.permission\.USE_BIOMETRIC|android\.permission\.USE_FINGERPRINT|com\.rpideas\.secretmessage\.preview\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)$'
          unexpected="$(tr ' ' '\n' <<<"$permissions" | grep -v -E '^$' | grep -v -E "$allowed" | tr '\n' ' ' || true)"
          if [[ -n "${unexpected// /}" ]]; then
            echo "::error title=secretmessage-preview-permissions::Unexpected permission(s) in the merged preview APK: $unexpected (all: $permissions)"
            exit 1
          fi
          sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          size="$(stat -c %s "$apk")"
          echo "::notice title=secretmessage-preview-apk::Debug test APK $(basename "$apk"), version $version, $size bytes, SHA-256 $sha256. Merged permissions: ${permissions:-none}. Not secure; not for release."
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          {
            echo '### Secret Message preview (debug, test only)'
            echo "- Version: \`$version\`"
            echo "- Size: $size bytes"
            echo "- SHA-256: \`$sha256\`"
            echo "- Merged permissions: ${permissions:-none}"
            echo '- This is a local-only, NOT SECURE preview with no network permission or MLS transport.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test-only preview APK
        uses: actions/upload-artifact@v7
        with:
          name: secretmessage-preview-debug-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Launch and exercise the preview in an Android 15 emulator
        timeout-minutes: 15
        shell: bash
        run: bash secretmessage/product/run-preview-on-emulator.sh "${{ steps.apk.outputs.path }}"
