# GitHub Actions workflow: builds the Android APKs in the cloud, for free.
# - Internet Radio  (:app)
# - CleanSweep junk cleaner + on-device assistant (:cleaner)
# - AppForge offline app builder (:builder)
# - PulseEQ 20-band equalizer (:equalizer)
name: Build APK

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:   # lets you start a build manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14.3

      - name: Ensure stable signing keystore
        run: |
          if [ ! -f ci-keystore/release.p12 ]; then
            mkdir -p ci-keystore
            keytool -genkeypair -keystore ci-keystore/release.p12 -storetype pkcs12 \
              -storepass cleansweep-ci -keypass cleansweep-ci -alias cleansweep \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CleanSweep CI, OU=Dev, O=universalrp2003, C=IN"
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add ci-keystore/release.p12
            git commit -m "CI: add stable signing keystore (same signature for every build)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build debug APKs
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Verify built APKs
        run: |
          set -eo pipefail
          exec > >(tee verify.log) 2>&1
          echo "=== APK files ==="
          for m in app cleaner builder equalizer; do
            ls -la "$m/build/outputs/apk/debug/" || true
          done

          CLEANER=$(ls cleaner/build/outputs/apk/debug/*.apk | head -1)
          BUILDER=$(ls builder/build/outputs/apk/debug/*.apk | head -1)

          echo "=== Package info ==="
          AAPT=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$CLEANER" | head -2 || true
            "$AAPT" dump badging "$BUILDER" | head -2 || true
          else
            echo "(aapt2 not available; skipping badging)"
          fi

          echo "=== CleanSweep v1.3 checks ==="
          MANIFEST=$(unzip -p "$CLEANER" AndroidManifest.xml | strings -a)
          if echo "$MANIFEST" | grep -qi "accessibilityservice\|BIND_ACCESSIBILITY_SERVICE"; then
            echo "FAIL: CleanSweep still declares an Accessibility service"
            exit 1
          fi
          echo "OK: no Accessibility service in CleanSweep's manifest"

          DEX=$(unzip -p "$CLEANER" "classes*.dex")
          if echo "$DEX" | grep -aq "CacheCleanerService"; then
            echo "FAIL: CacheCleanerService is still compiled into the APK"
            exit 1
          fi
          echo "OK: CacheCleanerService is gone"

          echo "$DEX" | grep -aq "CleanSweep Assistant" \
            && echo "OK: on-device assistant is present" \
            || { echo "FAIL: assistant missing from APK"; exit 1; }

          echo "=== AppForge checks ==="
          APP_DEX=$(unzip -p "$BUILDER" "classes*.dex")
          echo "$APP_DEX" | grep -aq "AppForge" \
            && echo "OK: AppForge APK contains its code" \
            || { echo "FAIL: AppForge APK looks empty"; exit 1; }
          echo "$APP_DEX" | grep -aq "AndroidCodeGen" \
            && echo "OK: Android project generator is present" \
            || { echo "FAIL: code generator missing"; exit 1; }

          echo "=== PulseEQ checks ==="
          EQ=$(ls equalizer/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $EQ"
          EQ_MANIFEST=$(unzip -p "$EQ" AndroidManifest.xml | tr -d '\0' | strings -a)
          PERMS=$(echo "$EQ_MANIFEST" | grep -o "android\.permission\.[A-Z_]*" | sort -u || true)
          echo "Permissions declared: ${PERMS:-none found}"
          if echo "$PERMS" | grep -qx "android.permission.INTERNET"; then
            echo "FAIL: PulseEQ must not request INTERNET"
            exit 1
          fi
          echo "OK: PulseEQ has no INTERNET permission (fully offline)"
          if echo "$EQ_MANIFEST" | grep -aq "EqService"; then
            echo "OK: background equalizer service declared"
          else
            echo "FAIL: EqService missing from the equalizer manifest"
            echo "manifest strings: $(echo "$EQ_MANIFEST" | tr '\n' ' ' | head -c 600)"
            exit 1
          fi

          EQ_DEX=$(unzip -p "$EQ" "classes*.dex" | tr -d '\0')
          for symbol in PeakingBiquad EqEngine SessionEffectReceiver Bands; do
            if echo "$EQ_DEX" | grep -aq "$symbol"; then
              echo "OK: $symbol present in the equalizer APK"
            else
              echo "FAIL: $symbol missing from the equalizer APK"
              exit 1
            fi
          done
          echo "ALL CHECKS PASSED"

      - name: Surface build errors
        if: failure()
        run: |
          echo "::error::Build failed - details committed to ci-build-failure.md on this branch"

      # Commits whatever failed into ci-build-failure.md, so the reason is
      # readable straight from the repository (and from a phone).
      - name: Publish build failure excerpt
        if: failure()
        run: |
          {
            echo "# CI build failure excerpt"
            echo ""
            if [ -f build.log ]; then
              echo "## Kotlin / resource errors"
              echo '```'
              grep -E "^e: " build.log | sed 's|file:///home/runner/work/InternetRadio/InternetRadio/||' | head -60 || true
              echo '```'
              echo ""
              echo "## Gradle summary"
              echo '```'
              grep -B2 -A30 -m1 "FAILURE: Build failed" build.log || true
              echo '```'
            else
              echo "_No Gradle build log: the failure happened before or after the build._"
            fi
            if [ -f verify.log ]; then
              echo ""
              echo "## APK verification output"
              echo '```'
              tail -80 verify.log || true
              echo '```'
            fi
          } > ci-build-failure.md
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-build-failure.md
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "CI: publish build failure excerpt"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Could not push the report."
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Internet Radio APK
        uses: actions/upload-artifact@v4
        with:
          name: internet-radio-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload CleanSweep APK
        uses: actions/upload-artifact@v4
        with:
          name: cleansweep-apk
          path: cleaner/build/outputs/apk/debug/*.apk

      - name: Upload AppForge APK
        uses: actions/upload-artifact@v4
        with:
          name: appforge-apk
          path: builder/build/outputs/apk/debug/*.apk

      - name: Upload PulseEQ APK
        uses: actions/upload-artifact@v4
        with:
          name: pulseeq-apk
          path: equalizer/build/outputs/apk/debug/*.apk
