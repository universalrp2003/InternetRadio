# GitHub Actions workflow: builds the Android APKs in the cloud, for free.
# - Internet Radio  (:app)
# - CleanSweep junk cleaner + on-device assistant (:cleaner)
# - AppForge offline app builder (:builder)
# - PulseEQ 20-band equalizer (:equalizer)
name: Build APK

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:   # lets you start a build manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14.3

      - name: Ensure stable signing keystore
        run: |
          if [ ! -f ci-keystore/release.p12 ]; then
            mkdir -p ci-keystore
            keytool -genkeypair -keystore ci-keystore/release.p12 -storetype pkcs12 \
              -storepass cleansweep-ci -keypass cleansweep-ci -alias cleansweep \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CleanSweep CI, OU=Dev, O=universalrp2003, C=IN"
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add ci-keystore/release.p12
            git commit -m "CI: add stable signing keystore (same signature for every build)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build debug APKs
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Verify built APKs
        run: |
          set -e
          exec > >(tee verify.log) 2>&1
          WORK=$(mktemp -d)

          echo "=== APK files ==="
          for m in app cleaner builder equalizer; do
            ls -la "$m/build/outputs/apk/debug/" || true
          done

          CLEANER=$(ls cleaner/build/outputs/apk/debug/*.apk | head -1)
          BUILDER=$(ls builder/build/outputs/apk/debug/*.apk | head -1)
          EQ=$(ls equalizer/build/outputs/apk/debug/*.apk | head -1)

          echo "=== Package info ==="
          AAPT=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$CLEANER" | head -1 || true
            "$AAPT" dump badging "$BUILDER" | head -1 || true
            "$AAPT" dump badging "$EQ" | head -1 || true
          else
            echo "(aapt2 not found; using the Gradle intermediates instead)"
          fi

          # The manifests are read from Gradle's plain-text merged manifests —
          # parsing the binary manifest out of the APK with `strings` is not
          # reliable. aapt2 output is used as a cross-check when available.
          MERGED_CLEANER=$(find cleaner/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1 || true)
          MERGED_EQ=$(find equalizer/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1 || true)
          echo "CleanSweep merged manifest: ${MERGED_CLEANER:-not found}"
          echo "PulseEQ merged manifest: ${MERGED_EQ:-not found}"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump permissions "$EQ" > "$WORK/eq-perms-aapt.txt" 2>/dev/null || true
            echo "--- aapt2 permissions for PulseEQ ---"
            cat "$WORK/eq-perms-aapt.txt" || true
          fi

          # Dex checks: extract once, then grep the files (no huge pipes, so no
          # spurious SIGPIPE failures).
          unzip -p "$CLEANER" "classes*.dex" > "$WORK/cleaner.dex"
          unzip -p "$BUILDER" "classes*.dex" > "$WORK/builder.dex"
          unzip -p "$EQ" "classes*.dex" > "$WORK/eq.dex"

          echo "=== CleanSweep v1.3 checks ==="
          if [ -n "$MERGED_CLEANER" ] && grep -qi "accessibilityservice\|BIND_ACCESSIBILITY_SERVICE" "$MERGED_CLEANER"; then
            echo "FAIL: CleanSweep still declares an Accessibility service"
            exit 1
          fi
          echo "OK: no Accessibility service in CleanSweep's manifest"

          if grep -aq "CacheCleanerService" "$WORK/cleaner.dex"; then
            echo "FAIL: CacheCleanerService is still compiled into the APK"
            exit 1
          fi
          echo "OK: CacheCleanerService is gone"

          if grep -aq "CleanSweep Assistant" "$WORK/cleaner.dex"; then
            echo "OK: the on-device assistant is in the APK"
          else
            echo "FAIL: the on-device assistant is missing from the APK"
            exit 1
          fi

          echo "=== AppForge checks ==="
          if grep -aq "AppForge" "$WORK/builder.dex"; then
            echo "OK: AppForge APK contains its code"
          else
            echo "FAIL: AppForge APK looks empty"
            exit 1
          fi
          if grep -aq "AndroidCodeGen" "$WORK/builder.dex"; then
            echo "OK: the Android project generator is present"
          else
            echo "FAIL: the code generator is missing"
            exit 1
          fi

          echo "=== PulseEQ checks ==="
          if [ -n "$MERGED_EQ" ]; then
            if grep -q "android.permission.INTERNET" "$MERGED_EQ"; then
              echo "FAIL: PulseEQ must not request INTERNET"
              grep -n "uses-permission" "$MERGED_EQ" || true
              exit 1
            fi
            echo "OK: PulseEQ requests no INTERNET permission (fully offline)"
            echo "Permissions in the merged manifest:"
            grep -o "android.permission.[A-Z_]*" "$MERGED_EQ" | sort -u || true
          else
            echo "WARN: merged manifest not found; falling back to aapt2 output"
            if grep -q "android.permission.INTERNET" "$WORK/eq-perms-aapt.txt"; then
              echo "FAIL: PulseEQ must not request INTERNET"
              exit 1
            fi
            echo "OK: no INTERNET permission in the aapt2 permission dump"
          fi

          if [ -n "$MERGED_EQ" ] && grep -q "EqService" "$MERGED_EQ"; then
            echo "OK: the background equalizer service is declared"
            grep -o 'android:name="[^"]*EqService"' "$MERGED_EQ" | head -2 || true
          elif [ -n "$AAPT" ] && "$AAPT" dump xmltree --file AndroidManifest.xml "$EQ" 2>/dev/null | grep -q "EqService"; then
            echo "OK: the background equalizer service is declared (aapt2)"
          else
            echo "FAIL: EqService could not be found in the equalizer manifest"
            exit 1
          fi

          for symbol in PeakingBiquad EqEngine SessionEffectReceiver Bands; do
            if grep -aq "$symbol" "$WORK/eq.dex"; then
              echo "OK: $symbol is in the equalizer APK"
            else
              echo "FAIL: $symbol is missing from the equalizer APK"
              exit 1
            fi
          done

          echo "ALL CHECKS PASSED"

      - name: Surface build errors
        if: failure()
        run: |
          echo "::error::Build failed - details committed to ci-build-failure.md on this branch"

      # Commits whatever failed into ci-build-failure.md, so the reason is
      # readable straight from the repository (and from a phone).
      - name: Publish build failure excerpt
        if: failure()
        run: |
          {
            echo "# CI build failure excerpt"
            echo ""
            if [ -f build.log ]; then
              echo "## Kotlin / resource errors"
              echo '```'
              grep -E "^e: " build.log | sed 's|file:///home/runner/work/InternetRadio/InternetRadio/||' | head -60 || true
              echo '```'
              echo ""
              echo "## Gradle summary"
              echo '```'
              grep -B2 -A30 -m1 "FAILURE: Build failed" build.log || true
              echo '```'
            else
              echo "_No Gradle build log: the failure happened before or after the build._"
            fi
            if [ -f verify.log ]; then
              echo ""
              echo "## APK verification output"
              echo '```'
              tail -80 verify.log || true
              echo '```'
            fi
          } > ci-build-failure.md
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-build-failure.md
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "CI: publish build failure excerpt"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Could not push the report."
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Internet Radio APK
        uses: actions/upload-artifact@v4
        with:
          name: internet-radio-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload CleanSweep APK
        uses: actions/upload-artifact@v4
        with:
          name: cleansweep-apk
          path: cleaner/build/outputs/apk/debug/*.apk

      - name: Upload AppForge APK
        uses: actions/upload-artifact@v4
        with:
          name: appforge-apk
          path: builder/build/outputs/apk/debug/*.apk

      - name: Upload PulseEQ APK
        uses: actions/upload-artifact@v4
        with:
          name: pulseeq-apk
          path: equalizer/build/outputs/apk/debug/*.apk
