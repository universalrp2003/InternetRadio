# GitHub Actions workflow: builds the four legacy-batch apps and compiles the isolated Secret Message preview (debug/test only). Oor Arivippu has a separate release workflow.
# - Live Guard / CleanSweep (:cleaner)
# - Ramesh Radio (:radio)
# - PulseEQ (:equalizer)
# - RP VOCAL REMOVER STUDIO (:vocalremover; direct-download APK)
name: Build APK

on:
  push:
    branches: [ main, "arena/**" ]
    # A dated workspace tag requests a verified batch publication; the resulting APKs
    # receive separate, version-specific release tags for each of the four requested apps.
    tags: [ "v*" ]
    # Oor Arivippu has a separate test/release flow, and the non-shipping Secret Message preview and
    # MLS feasibility lanes have their own test-only workflows; skip their files and workflow-only edits.
    paths-ignore:
      - "oorarivippu/**"
      - "secretmessage/**"
      - "docs/secret-message-security-design.md"
      - "tools/tests/test_secretmessage_preview_contract.py"
      - ".github/workflows/build-apk.yml"
      - ".github/workflows/oorarivippu-release.yml"
      - ".github/workflows/oorarivippu-test-apk.yml"
      - ".github/workflows/secret-message-preview.yml"
      - ".github/workflows/secret-message-mls-rs-candidate.yml"
      - ".github/workflows/secret-message-mls-spike.yml"
      - ".github/workflows/secret-message-mls-upstream-candidate.yml"
      - ".github/workflows/secret-message-wifi-test.yml"
      - ".github/workflows/secret-message-relay.yml"
      - ".github/workflows/secret-message-signing-key.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New-release batch tag (e.g. v2026.10.13); blank for build-only or mirror_existing runs'
        required: false
        type: string
      mirror_existing:
        description: 'Mirror the current public InternetRadio APK releases to RP-Android-Apps without changing the old releases (requires the destination write secret)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # The hosted Ubuntu images already contain Android SDK command-line tools. Use
      # sdkmanager directly instead of the Node-based setup action; the latter failed
      # before compilation on the current runner, so it never reached the NDK/build steps.
      - name: Install Android NDK for native runtime packaging
        shell: bash
        run: |
          set -eu
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            for candidate in \
              "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
              "$sdk_root/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then
                sdkmanager="$candidate"
                break
              fi
            done
          fi
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "::error::Android sdkmanager was not found under $sdk_root"
            exit 1
          fi
          echo "Using $sdkmanager (SDK root: $sdk_root)"
          license_answers="$(mktemp)"
          trap 'rm -f "$license_answers"' EXIT
          for _ in {1..100}; do printf 'y\n' >> "$license_answers"; done
          "$sdkmanager" --sdk_root="$sdk_root" --licenses < "$license_answers" >/dev/null
          "$sdkmanager" --sdk_root="$sdk_root" --install "ndk;27.2.12479018"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14.3

      # F-Droid's build server (and anyone building locally) prefers a committed wrapper:
      # it is what pins the Gradle version. CI generates it anyway, so it commits it once.
      - name: Commit the Gradle wrapper (once)
        run: |
          # -f gradlew is always true here: the step above just generated it. What matters
          # is whether git already tracks it.
          if git ls-files --error-unmatch gradlew >/dev/null 2>&1; then
            echo "the wrapper is already committed."
            exit 0
          fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git commit -q -m "CI: commit the Gradle wrapper (pins Gradle 8.14.3 for F-Droid and local builds)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "wrapper committed and pushed."
              exit 0
            fi
            echo "push attempt $attempt failed; retrying..."
            sleep 6
          done
          echo "could not push the wrapper; the build continues without it."

      # The project is GPL-3.0 (the author's choice). F-Droid and IzzyOnDroid both require the
      # licence text in the repository, so this commits the verbatim SPDX copy once. The text
      # is fetched rather than pasted, so it cannot be mistyped.
      - name: Add the licence file (once)
        run: |
          # Nothing to do when LICENSE is already there in the right shape: the licence text
          # has to come first, or GitHub and the stores do not recognise the file as GPL-3.0.
          if git ls-files --error-unmatch LICENSE >/dev/null 2>&1 && \
             head -c 60 LICENSE | grep -q "GNU GENERAL PUBLIC LICENSE"; then
            echo "LICENSE is already committed and starts with the licence text."
            exit 0
          fi
          TMP=$(mktemp)
          curl -fsSL https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0-only.txt -o "$TMP" \
            || curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o "$TMP" || true
          SIZE=$(wc -c < "$TMP" | tr -d ' ')
          echo "fetched $SIZE bytes of licence text"
          if [ "$SIZE" -lt 20000 ]; then
            echo "FAIL: the licence text did not download completely - refusing to commit a partial licence"
            exit 1
          fi
          {
            cat "$TMP"
            echo ""
            echo "========================================================================"
            echo ""
            echo "How to apply this licence to these apps"
            echo ""
            echo "Live Guard (CleanSweep), Ramesh Radio, PulseEQ and RP Vocal Remover Studio"
            echo "Copyright (C) 2026 Ramesh prathap .R <universalrp2003@gmail.com>"
            echo ""
            echo "This program is free software: you can redistribute it and/or modify it under"
            echo "the terms of the GNU General Public License as published by the Free Software"
            echo "Foundation, either version 3 of the License, or (at your option) any later"
            echo "version."
            echo ""
            echo "This program is distributed in the hope that it will be useful, but WITHOUT ANY"
            echo "WARRANTY; without even the implied warranty of MERCHANTABILITY or FITNESS FOR A"
            echo "PARTICULAR PURPOSE. See the GNU General Public License for more details."
            echo ""
            echo "You should have received a copy of the GNU General Public License along with"
            echo "this program. If not, see <https://www.gnu.org/licenses/>."
          } > LICENSE
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add LICENSE
          git commit -q -m "Add the licence: GNU GPL v3 (Copyright (C) 2026 Ramesh prathap .R)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "licence committed and pushed."
              exit 0
            fi
            echo "push attempt $attempt failed; retrying..."
            sleep 6
          done
          echo "could not push the licence; the build continues without it."

      - name: Ensure stable signing keystore
        run: |
          if [ ! -f ci-keystore/release.p12 ]; then
            mkdir -p ci-keystore
            keytool -genkeypair -keystore ci-keystore/release.p12 -storetype pkcs12 \
              -storepass cleansweep-ci -keypass cleansweep-ci -alias cleansweep \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CleanSweep CI, OU=Dev, O=universalrp2003, C=IN"
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add ci-keystore/release.p12
            git commit -m "CI: add stable signing keystore (same signature for every build)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Make the store icons
        run: |
          set -e
          # The apps draw their launcher marks as vectors, and stores want PNGs (F-Droid:
          # 512x512 icon plus a 1024x500 feature graphic). The icons are rasterised by pure
          # Python, so they work anywhere; the graphics need ImageMagick, which is installed
          # here if the runner does not already have it.
          set -x
          python3 --version
          command -v convert identify || true
          convert -version 2>/dev/null | head -2 || true
          if ! command -v convert >/dev/null || ! command -v identify >/dev/null; then
            echo "Installing ImageMagick and a font for the feature graphics..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick fonts-dejavu-core
          fi
          set +x
          # tee, so the output lands in store-art.log and the failure report can quote it:
          # the Actions log endpoint is not always readable from outside.
          {
            python3 tools/make_store_assets.py icons
            bash tools/make_feature_graphics.sh
          } 2>&1 | tee store-art.log

      - name: Check Cleaner source contracts and localization
        run: |
          python3 tools/verify_cleaner_localization.py
          python3 tools/verify_apps_localization.py
          # v2.40 core: the retired notification reader must not exist in the manifest,
          # the production tree or the build scripts. Historical 2.39 sources stay in
          # docs/archived-notification-reader-2.39 and are never compiled.
          python3 tools/verify_cleaner_core_manifest.py
          # 2.42: every tools test runs here, including the permission-delta gate that now
          # decides when a release needs a recorded device install.
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 tools/verify_cleaner_next_update_source.py

      - name: Build the APKs
        run: |
          set -o pipefail
          # The four maintained apps get release APKs. Secret Message is a separate,
          # local-only preview: run its policy tests and build only its debug APK. It is
          # deliberately excluded from every release/bundle task below. Vocal Remover is
          # standalone and distributed by direct APK download, so it has no Play bundle.
          gradle :cleaner:testDebugUnitTest :cleaner:testReleaseUnitTest :radio:testDebugUnitTest :radio:testReleaseUnitTest :equalizer:testDebugUnitTest :equalizer:testReleaseUnitTest :vocalremover:testDebugUnitTest :vocalremover:testReleaseUnitTest :secretmessage:testDebugUnitTest assembleDebug :cleaner:assembleRelease :radio:assembleRelease :equalizer:assembleRelease :vocalremover:assembleRelease :cleaner:bundleRelease :radio:bundleRelease :equalizer:bundleRelease --no-daemon 2>&1 | tee build.log

      - name: Verify required CleanSweep regression suites
        run: python3 tools/verify_cleaner_regressions.py

      - name: Verify Vocal Remover recovery and export regression suites
        run: python3 tools/verify_vocalremover_reliability.py

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            cleaner/build/test-results/test*UnitTest/*.xml
            radio/build/test-results/test*UnitTest/*.xml
            vocalremover/build/test-results/test*UnitTest/*.xml
            secretmessage/product/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Verify built APKs
        run: |
          set -e
          exec > >(tee verify.log) 2>&1
          WORK=$(mktemp -d)

          echo "=== APK files ==="
          for m in cleaner equalizer radio vocalremover; do
            ls -la "$m/build/outputs/apk/debug/" || true
          done
          ls -la secretmessage/product/build/outputs/apk/debug/

          SECRET_MESSAGE_PREVIEW=$(ls secretmessage/product/build/outputs/apk/debug/*.apk | head -1)
          test -n "$SECRET_MESSAGE_PREVIEW" || { echo "FAIL: Secret Message local preview debug APK was not produced"; exit 1; }
          if compgen -G "secretmessage/product/build/outputs/apk/release/*.apk" >/dev/null; then
            echo "FAIL: the Secret Message local preview must not produce a release APK"; exit 1
          fi

          CLEANER=$(ls cleaner/build/outputs/apk/debug/*.apk | head -1)
          EQ=$(ls equalizer/build/outputs/apk/debug/*.apk | head -1)
          RADIO=$(ls radio/build/outputs/apk/debug/*.apk | head -1)
          VOCAL_REMOVER=$(ls vocalremover/build/outputs/apk/debug/*.apk | head -1)
          VOCAL_REMOVER_REL=$(ls vocalremover/build/outputs/apk/release/*.apk | head -1)
          test -n "$VOCAL_REMOVER" || { echo "FAIL: Vocal Remover debug APK was not produced"; exit 1; }
          test -n "$VOCAL_REMOVER_REL" || { echo "FAIL: Vocal Remover signed release APK was not produced"; exit 1; }
          if compgen -G "vocalremover/build/outputs/bundle/release/*.aab" >/dev/null; then
            echo "FAIL: Vocal Remover is distributed as a standalone direct-download APK, not a Play bundle"
            exit 1
          fi
          echo "OK: standalone Vocal Remover debug + release APKs: $VOCAL_REMOVER / $VOCAL_REMOVER_REL"

          # The user-facing updaters use these exact signed release APKs.
          CLEANER_REL=$(ls cleaner/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          EQ_REL=$(ls equalizer/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          RADIO_REL=$(ls radio/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          VOCAL_REMOVER_REL=$(ls vocalremover/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          echo "=== Google Play bundles (.aab) for the three store-packaged apps ==="
          for b in "cleaner|CleanSweep" "equalizer|PulseEQ" "radio|Ramesh-Radio"; do
            mod="${b%%|*}"; pretty="${b##*|}"
            aab=$(ls "$mod"/build/outputs/bundle/release/*.aab 2>/dev/null | head -1 || true)
            if [ -z "$aab" ]; then
              echo "FAIL: no .aab bundle for $mod - Google Play cannot take an APK"
              exit 1
            fi
            ver=$(grep -m1 'versionName' "$mod/build.gradle.kts" | sed -E 's/.*"([^"]+)".*/\1/')
            mv "$aab" "$(dirname "$aab")/${pretty}-v${ver}.aab"
            echo "OK: ${pretty}-v${ver}.aab inside the build"
          done

          echo "=== signed release APKs ==="
          for rel in "$CLEANER_REL" "$RADIO_REL" "$EQ_REL" "$VOCAL_REMOVER_REL"; do
            if [ -z "$rel" ]; then
              echo "FAIL: a release APK was not produced - stores cannot use the debug build"
              exit 1
            fi
            echo "OK: $rel"
          done

          echo "=== App icons inside the built APKs ==="
          # Check the active APKs through aapt2 badging, not by looking for a file name:
          # Android resource optimisation can rename paths inside a release APK.
          AAPT=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ -z "$AAPT" ]; then
            echo "FAIL: aapt2 not found, cannot verify the app icons"
            exit 1
          fi
          PREVIEW_BADGING=$("$AAPT" dump badging "$SECRET_MESSAGE_PREVIEW")
          echo "$PREVIEW_BADGING" | grep -Fq "application-label:'Secret Message Preview (NOT SECURE)'" || {
            echo "FAIL: Secret Message preview APK is missing its explicit not-secure label"; exit 1;
          }
          AAPT_LEGACY="$(dirname "$AAPT")/aapt"
          if [ ! -x "$AAPT_LEGACY" ]; then
            echo "FAIL: legacy aapt is needed to verify merged APK permissions"; exit 1
          fi
          PREVIEW_PERMISSIONS=$("$AAPT_LEGACY" dump permissions "$SECRET_MESSAGE_PREVIEW")
          echo "=== Secret Message preview merged APK permissions ==="
          if [ -n "$PREVIEW_PERMISSIONS" ]; then printf '%s\n' "$PREVIEW_PERMISSIONS"; else echo "(none reported)"; fi
          {
            echo '### Secret Message preview merged APK permissions'
            echo '```text'
            if [ -n "$PREVIEW_PERMISSIONS" ]; then printf '%s\n' "$PREVIEW_PERMISSIONS"; else echo '(none reported)'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if printf '%s\n' "$PREVIEW_PERMISSIONS" | grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|CHANGE_NETWORK_STATE)'; then
            echo "FAIL: Secret Message local preview unexpectedly includes a network permission"; exit 1
          fi
          echo "OK: Secret Message debug preview is labelled NOT SECURE and includes no network permission"
          for rel in "$CLEANER_REL" "$RADIO_REL" "$EQ_REL" "$VOCAL_REMOVER_REL"; do
            bad=$("$AAPT" dump badging "$rel" || true)
            icon=$(printf '%s\n' "$bad" | sed -n "s/^application:.*icon='\([^']*\)'.*/\1/p" | head -1)
            dens=$(printf '%s\n' "$bad" | grep -c "^application-icon-" || true)
            case "$icon" in
              "") echo "FAIL: $rel declares no application icon"; exit 1 ;;
              *android:*) echo "FAIL: $rel still borrows a platform icon ($icon)"; exit 1 ;;
            esac
            if [ "$dens" -eq 0 ]; then
              echo "FAIL: $rel has no density-specific icon entries"
              exit 1
            fi
            echo "OK: $rel icon=$icon ($dens density entries)"
          done
          echo "OK: every active module declares its own launcher icon"

          echo "=== Package info ==="
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$CLEANER" | head -1 || true
            "$AAPT" dump badging "$EQ" | head -1 || true
            "$AAPT" dump badging "$RADIO" | head -1 || true
            # The installed name must be the one the user asked for.
            CLEANER_LABEL=$("$AAPT" dump badging "$CLEANER" | grep -m1 "application-label:" || true)
            echo "cleaner label: $CLEANER_LABEL"
            LABEL=$("$AAPT" dump badging "$RADIO" | grep -m1 "application-label:" || true)
            echo "radio label: $LABEL"
            case "$LABEL" in
              *"Ramesh Radio"*)
                echo "OK: the built APK is labelled Ramesh Radio"
                ;;
              *)
                echo "FAIL: the radio APK is not labelled Ramesh Radio ($LABEL)"
                exit 1
                ;;
            esac
            VOCAL_LABEL=$("$AAPT" dump badging "$VOCAL_REMOVER_REL" | grep -m1 "application-label:" || true)
            echo "vocal-remover label: $VOCAL_LABEL"
            case "$VOCAL_LABEL" in
              *"RP VOCAL REMOVER STUDIO"*) echo "OK: the signed APK carries the standalone studio name" ;;
              *) echo "FAIL: Vocal Remover release label is unexpected ($VOCAL_LABEL)"; exit 1 ;;
            esac
            # A store will not accept a debuggable APK (IzzyOnDroid says so explicitly).
            for rel in "$CLEANER_REL" "$RADIO_REL" "$EQ_REL" "$VOCAL_REMOVER_REL"; do
              if "$AAPT" dump badging "$rel" | grep -q "application-debuggable"; then
                echo "FAIL: $rel carries the debuggable flag - app stores reject that"
                exit 1
              fi
            done
            echo "OK: no release APK carries the debuggable flag"
            APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
            if [ -z "$APKSIGNER" ]; then
              echo "FAIL: apksigner is required to verify every release APK"
              exit 1
            fi
            keytool -exportcert -keystore ci-keystore/release.p12 -storepass cleansweep-ci \
              -alias cleansweep -file "$WORK/project-certificate.der"
            EXPECTED_CERT=$(sha256sum "$WORK/project-certificate.der" | cut -d' ' -f1)
            if [ "$EXPECTED_CERT" != "9e30f4eab8afce5e4ab444ff9578fec354d6d1414d245253590a9703d5985d55" ]; then
              echo "FAIL: stable signing identity differs from previously published releases"; exit 1
            fi
            for rel in "$CLEANER_REL" "$RADIO_REL" "$EQ_REL" "$VOCAL_REMOVER_REL"; do
              # Do not mask signature failures with a pipeline or || true.
              "$APKSIGNER" verify --print-certs "$rel" > "$WORK/signature.txt"
              cat "$WORK/signature.txt"
              # SDK tools use either "Signer #1" or "V2 Signer" (and can report
              # the same key for multiple schemes). Accept labels, never a different key.
              ACTUAL_CERT=$(sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' "$WORK/signature.txt" | tr -d ' :\r' | tr 'A-F' 'a-f' | sort -u)
              if [ -z "$ACTUAL_CERT" ]; then
                echo "FAIL: could not read the verified APK signing certificate digest"
                exit 1
              fi
              if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
                echo "FAIL: $rel does not use the existing project signing certificate"
                exit 1
              fi
              echo "OK: $rel signature verified with the existing project key"
            done
            # The version in the download filename must match the installable release,
            # and API 26 support must not disappear silently.
            "$AAPT" dump badging "$CLEANER_REL" > "$WORK/cleaner-release-badging.txt"
            EXPECTED_CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' cleaner/build.gradle.kts)
            EXPECTED_NAME=$(grep -m1 'versionName' cleaner/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            cat "$WORK/cleaner-release-badging.txt"
            echo "Expected CleanSweep: versionCode=$EXPECTED_CODE versionName=$EXPECTED_NAME minSdk=26"
            if ! grep -Fq "versionCode='$EXPECTED_CODE'" "$WORK/cleaner-release-badging.txt"; then
              echo "FAIL: CleanSweep release versionCode differs from source"; exit 1
            fi
            if ! grep -Fq "versionName='$EXPECTED_NAME'" "$WORK/cleaner-release-badging.txt"; then
              echo "FAIL: CleanSweep release versionName differs from source"; exit 1
            fi
            # SDK releases use sdkVersion or minSdkVersion, with optional whitespace.
            # Match the MINIMUM SDK field, not targetSdkVersion or a bare '26' elsewhere.
            if ! grep -Eiq "(^|[[:space:]])(sdkVersion|minSdkVersion)[[:space:]]*[:=][[:space:]]*['\"]?26(['\"]|[[:space:]]|$)" "$WORK/cleaner-release-badging.txt"; then
              echo "FAIL: CleanSweep release must declare minimum SDK 26"; exit 1
            fi
            echo "OK: CleanSweep release version matches source and still supports API 26"

            verify_app_version() {
              module="$1"; apk="$2"; required_min_sdk="$3"; app_label="$4"
              badging_file="$WORK/${module}-release-badging.txt"
              expected_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' "$module/build.gradle.kts" | head -1)
              expected_name=$(grep -m1 'versionName' "$module/build.gradle.kts" | sed -E 's/.*"([^"]+)".*/\1/')
              source_min_sdk=$(sed -nE 's/^[[:space:]]*minSdk = ([0-9]+).*/\1/p' "$module/build.gradle.kts" | head -1)
              if [ "$source_min_sdk" != "$required_min_sdk" ]; then
                echo "FAIL: $app_label source minSdk=$source_min_sdk; expected $required_min_sdk"; exit 1
              fi
              "$AAPT" dump badging "$apk" > "$badging_file"
              grep -Fq "versionCode='$expected_code'" "$badging_file" || { echo "FAIL: $app_label versionCode differs from source"; exit 1; }
              grep -Fq "versionName='$expected_name'" "$badging_file" || { echo "FAIL: $app_label versionName differs from source"; exit 1; }
              grep -Eiq "(^|[[:space:]])(sdkVersion|minSdkVersion)[[:space:]]*[:=][[:space:]]*['\"]?$required_min_sdk(['\"]|[[:space:]]|$)" "$badging_file" || { echo "FAIL: $app_label minSdk in the APK is not $required_min_sdk"; exit 1; }
              echo "OK: $app_label release version=$expected_name code=$expected_code minSdk=$required_min_sdk"
            }
            verify_app_version radio "$RADIO_REL" 26 "Ramesh Radio"
            verify_app_version equalizer "$EQ_REL" 26 "PulseEQ"
            verify_app_version vocalremover "$VOCAL_REMOVER_REL" 29 "RP VOCAL REMOVER STUDIO"
          else
            echo "(aapt2 not found; using the Gradle intermediates instead)"
          fi

          # Actual delivered universal APK must fit the in-app updater, not just a fake test size.
          UPDATE_CAP_MB=$(sed -nE 's/.*MAX_APK_BYTES = ([0-9]+)L \* 1024 \* 1024.*/\1/p' cleaner/src/main/java/com/universalrp/cleansweep/updates/UpdatePolicy.kt)
          test -n "$UPDATE_CAP_MB"
          ACTUAL_BYTES=$(stat -c '%s' "$CLEANER_REL")
          if [ "$ACTUAL_BYTES" -gt "$((UPDATE_CAP_MB * 1024 * 1024))" ]; then
            echo "FAIL: release APK exceeds the in-app updater limit"; exit 1
          fi
          echo "OK: actual CleanSweep APK $ACTUAL_BYTES bytes fits updater cap ${UPDATE_CAP_MB}MiB"
          # The immediate successor must also be downloadable by existing2.39 clients.
          if [ "$ACTUAL_BYTES" -gt "$((50 * 1024 * 1024))" ]; then
            echo "FAIL:2.40 delivery must fit2.39's50MiB updater cap"; exit 1
          fi
          echo "OK: actual2.40 APK also fits the previous2.39 client's50MiB cap"
          SHARED_UPDATE_CAP_MB=$(sed -nE 's/.*MAX_APK_BYTES = ([0-9]+)L \* 1024 \* 1024.*/\1/p' shared/src/main/java/com/universalrp/updates/AppUpdates.kt)
          test -n "$SHARED_UPDATE_CAP_MB"
          for app_asset in "Ramesh Radio|$RADIO_REL" "PulseEQ|$EQ_REL" "RP VOCAL REMOVER STUDIO|$VOCAL_REMOVER_REL"; do
            app_label="${app_asset%%|*}"; apk="${app_asset##*|}"; bytes=$(stat -c '%s' "$apk")
            if [ "$bytes" -gt "$((SHARED_UPDATE_CAP_MB * 1024 * 1024))" ]; then
              echo "FAIL: $app_label APK is larger than its verified-updater cap"; exit 1
            fi
            echo "OK: $app_label APK is $bytes bytes, within the updater cap ${SHARED_UPDATE_CAP_MB}MiB"
          done

          # The manifests are read from Gradle's plain-text merged manifests —
          # parsing the binary manifest out of the APK with `strings` is not
          # reliable. aapt2 output is used as a cross-check when available.
          MERGED_CLEANER=$(find cleaner/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1 || true)
          MERGED_EQ=$(find equalizer/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1 || true)
          MERGED_RADIO=$(find radio/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1 || true)
          MERGED_VOCAL=$(find vocalremover/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1 || true)
          echo "CleanSweep merged manifest: ${MERGED_CLEANER:-not found}"
          echo "PulseEQ merged manifest: ${MERGED_EQ:-not found}"
          echo "Ramesh Radio merged manifest: ${MERGED_RADIO:-not found}"
          echo "RP Vocal Remover merged manifest: ${MERGED_VOCAL:-not found}"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump permissions "$EQ" > "$WORK/eq-perms-aapt.txt" 2>/dev/null || true
            echo "--- aapt2 permissions for PulseEQ ---"
            cat "$WORK/eq-perms-aapt.txt" || true
          fi

          # Dex checks: extract once, then grep the files (no huge pipes, so no
          # spurious SIGPIPE failures).
          unzip -p "$CLEANER" "classes*.dex" > "$WORK/cleaner.dex"
          # v2.40: the release variant gets its own DEX blob so the retired reader classes
          # are rejected in BOTH shipped variants, not only in debug.
          unzip -p "$CLEANER_REL" "classes*.dex" > "$WORK/cleaner-release.dex"
          unzip -p "$EQ" "classes*.dex" > "$WORK/eq.dex"
          unzip -p "$RADIO" "classes*.dex" > "$WORK/radio.dex"
          unzip -p "$VOCAL_REMOVER" "classes*.dex" > "$WORK/vocal-remover-debug.dex"
          unzip -p "$VOCAL_REMOVER_REL" "classes*.dex" > "$WORK/vocal-remover-release.dex"
          unzip -l "$RADIO" > "$WORK/radio-entries.txt"

          # The estimate must be on the ACTIVE Home layout, not only an unused storage card.
          grep -Fq 'LiveGuardMetricsMatrix(' cleaner/src/main/java/com/universalrp/cleansweep/ui/HomeScreen.kt
          grep -Fq 'PhoneAgeBadge(state.phoneAge' cleaner/src/main/java/com/universalrp/cleansweep/ui/LiveGuardMetricsMatrix.kt
          grep -Fq 'tr("Estimated phone age")' cleaner/src/main/java/com/universalrp/cleansweep/ui/LiveGuardMetricsMatrix.kt
          echo "OK: active Home matrix retains the labelled phone-age estimate"

          echo "=== CleanSweep v1.3 checks ==="
          if [ -n "$MERGED_CLEANER" ] && grep -qi "accessibilityservice\|BIND_ACCESSIBILITY_SERVICE" "$MERGED_CLEANER"; then
            echo "FAIL: CleanSweep still declares an Accessibility service"
            exit 1
          fi
          echo "OK: no Accessibility service in CleanSweep's manifest"
          for symbol in NewsPolicy BatteryValuePolicy AssistantEvidencePolicy WidgetReadingPolicy VoiceDeliveryPolicy VoiceObserverStatus PowerVoiceWorker AutomaticAlerts PhoneAgeEstimator PhoneAgeBadge ReadingPolicy CompatibilityReport SecurityHistoryPolicy ChargeHistoryPolicy DataBudgetPolicy MobileCounterPolicy PermissionObservationPolicy ActionChecklistPolicy InsightsScreen; do
            if grep -aq "$symbol" "$WORK/cleaner.dex"; then echo "OK: $symbol is in the APK"
            else echo "FAIL: approved dashboard/history/tools feature $symbol missing from APK"; exit 1; fi
          done

          if grep -aq "CacheCleanerService" "$WORK/cleaner.dex"; then
            echo "FAIL: CacheCleanerService is still compiled into the APK"
            exit 1
          fi
          echo "OK: CacheCleanerService is gone"

          if grep -aq "CleanSweep Assistant" "$WORK/cleaner.dex"; then
            echo "OK: the on-device assistant is in the APK"
          else
            echo "FAIL: the on-device assistant is missing from the APK"
            exit 1
          fi

          if [ -n "$MERGED_CLEANER" ]; then
            if grep -q "WRITE_EXTERNAL_STORAGE" "$MERGED_CLEANER"; then
              echo "OK: legacy write permission declared (the Android 8/9/10 delete fix)"
            else
              echo "FAIL: WRITE_EXTERNAL_STORAGE is missing - cleaning would still report 0 MB on API 26-29"
              exit 1
            fi
            if grep -q "NEARBY_WIFI_DEVICES" "$MERGED_CLEANER" && \
               grep -q "ACCESS_FINE_LOCATION" "$MERGED_CLEANER"; then
              echo "OK: Wi-Fi device-scan permissions declared"
            else
              echo "FAIL: Wi-Fi scan permissions are missing"
              exit 1
            fi
            if grep -q "android.permission.INTERNET" "$MERGED_CLEANER"; then
              echo "OK: INTERNET declared (used only for the optional AI analysis)"
            else
              echo "FAIL: INTERNET is missing - AI analysis could never work"
              exit 1
            fi
          else
            echo "FAIL: could not find the merged manifest for :cleaner"
            exit 1
          fi

          if grep -q "FOREGROUND_SERVICE_SPECIAL_USE" "$MERGED_CLEANER" && \
             grep -q "ChargeMonitorService" "$MERGED_CLEANER"; then
            echo "OK: the charging-status service is declared"
          else
            echo "FAIL: the charging-status foreground service is missing"
            exit 1
          fi

          if grep -q "SYSTEM_ALERT_WINDOW" "$MERGED_CLEANER"; then
            echo "OK: overlay permission present for the status-bar watt reading"
          else
            echo "FAIL: SYSTEM_ALERT_WINDOW is missing (the watt reading needs it)"
            exit 1
          fi

          if grep -q "READ_PHONE_STATE" "$MERGED_CLEANER"; then
            echo "OK: phone-state permission present for the Mobile & data screen"
          else
            echo "FAIL: READ_PHONE_STATE is missing (signal / SIM / network type need it)"
            exit 1
          fi

          if grep -q "locales_config" "$MERGED_CLEANER"; then
            echo "OK: locale config present (English + Tamil)"
          else
            echo "FAIL: android:localeConfig is missing"
            exit 1
          fi

          # A compiled APK has no "values-ta" folder — resources live compiled inside
          # resources.arsc and the strings in the dex. Search both for the actual Tamil app
          # name, which is the thing the user cares about.
          if unzip -p "$CLEANER" resources.arsc | grep -qa "லைவ் கார்டு"; then
            echo "OK: the Tamil launcher label is inside the APK resources"
          else
            echo "WARN: the Tamil launcher label was not found in resources.arsc"
          fi
          if grep -aq "லைவ் கார்டு" "$WORK/cleaner.dex"; then
            echo "OK: the Tamil name is in the CleanSweep dex (menu + About)"
          else
            echo "WARN: the Tamil name was not found in the CleanSweep dex"
          fi
          if grep -aq "தினசரி அறிக்கை" "$WORK/cleaner.dex"; then
            echo "OK: the Tamil menu (daily brief) is inside the CleanSweep dex"
          else
            echo "WARN: the Tamil menu strings were not found in the CleanSweep dex"
          fi

          if unzip -l "$CLEANER" | grep -q "res/layout/widget_cleansweep"; then
            echo "OK: the home-screen widget layout is inside the APK"
          else
            echo "WARN: the widget layout is missing from the APK"
          fi

          for symbol in DeviceHealthReader BatteryReader CpuReader AppInventoryLoader \
                        SecurityScanner NetworkScanner AiClient AiReport identifyDevice \
                        ChargeMonitorService batteryTimeLabel StatusPill goBack \
                        defaultSelected useAnotherFreeAi ping AiText MobileNet SpeedMeter \
                        UsageStats MobileScreen ReadingMovePad moveBy applySaved savedFor \
                        setDraggable togglePillDrag setSpeedSizeMb speedSizeMb \
                        Announcer HealthWatchWorker VoiceScreen speakAnswer runDailyBriefNow \
                        setVoiceEvent setQuietHours speakNow offlineFallback \
                        SystemEventWatcher CleanSweepWidget answerLanguage setAnswerLanguage \
                        setUnplugStartHour ChargerWatchWorker ChargeNotifier canSearchWeb \
                        setOnlineVoice openScanner CrashLog StatusPillContent showNetworkMeter \
                        SecuritySettingsRoutes FindingApp SecurityAiPrompt runSecurityAiAnalysis powerConnected \
                        AiRequestPolicy RequestBudget BoundedHttp ProductEvidencePolicy PermissionReviewStore DisplayTime \
                        AnswerVoicePreferences AnswerVoicesCard FeatureSetupScreen CorePrivacyMigrationPolicy \
                        CorePrivacyMigration LiveGuardUpdates VerifiedApkDownload UpdatePolicy \
                        LastUnplugRepo CompactWidgetPolicy CleanSweepDataWidget CleanSweepPhoneWidget \
                        LocalReadGate cancelAiReport cancelDeviceIdentification \
                        ChargingHonestyPolicy ThermalWarningPolicy AiOutputBudgetPolicy; do
            if grep -aq "$symbol" "$WORK/cleaner.dex"; then
              echo "OK: $symbol is in the CleanSweep APK"
            else
              echo "FAIL: $symbol is missing from the CleanSweep APK"
              exit 1
            fi
          done

          echo "=== removed LM Arena rating feature gate (debug DEX) ==="
          for retired_rating in ArenaRatingPolicy ArenaRatings ArenaRatingCard; do
            if grep -aq "$retired_rating" "$WORK/cleaner.dex"; then
              echo "FAIL: retired model-rating symbol $retired_rating is compiled into CleanSweep"
              exit 1
            fi
            echo "OK: $retired_rating is absent from the CleanSweep APK"
          done

          echo "=== v2.40 retired notification-reader gate (debug AND release) ==="
          # Removing a manifest line is not enough: neither shipped variant may contain
          # the retired reader classes, and the archive/test-only copies must never
          # leak into production.
          for retired in MessageReaderService LocalMessageTranslator NotificationReaderPrefs \
                         NotificationReaderScreen NotificationReadingPolicy NotificationReaderConfig; do
            if grep -aq "$retired" "$WORK/cleaner.dex"; then
              echo "FAIL: retired reader class $retired is compiled into the DEBUG APK"
              exit 1
            fi
            if grep -aq "$retired" "$WORK/cleaner-release.dex"; then
              echo "FAIL: retired reader class $retired is compiled into the RELEASE APK"
              exit 1
            fi
            echo "OK: $retired is absent from both shipped APK variants"
          done
          python3 tools/verify_cleaner_core_manifest.py --manifest "$MERGED_CLEANER" --skip-source \
            --dex "$WORK/cleaner.dex" --dex "$WORK/cleaner-release.dex" || exit 1
          echo "OK: merged CleanSweep manifest and both DEX blobs declare no retired capability"

          echo "=== v2.41 honest-charging / heat-warning / AI-budget gate (debug AND release) ==="
          # The 2.41 features must be compiled into the shipped bytes, not only present in
          # the source tree: the battery-side policy, the owner-set heat warning and the AI
          # output budget + provider model check must all exist in both variants.
          for marker in batterySideWatts screenNote shouldAnnounce effectiveOutputTokens checkModel; do
            if grep -aq "$marker" "$WORK/cleaner.dex"; then
              echo "OK: $marker is in the CleanSweep DEBUG APK"
            else
              echo "FAIL: $marker is missing from the CleanSweep DEBUG APK"
              exit 1
            fi
            if grep -aq "$marker" "$WORK/cleaner-release.dex"; then
              echo "OK: $marker is in the CleanSweep RELEASE APK"
            else
              echo "FAIL: $marker is missing from the CleanSweep RELEASE APK"
              exit 1
            fi
          done

          echo "=== PulseEQ checks ==="
          if [ -n "$MERGED_EQ" ]; then
            if ! grep -q "android.permission.INTERNET" "$MERGED_EQ"; then
              echo "FAIL: PulseEQ update checker requires INTERNET"
              grep -n "uses-permission" "$MERGED_EQ" || true
              exit 1
            fi
            echo "OK: PulseEQ has INTERNET for optional release checks; audio remains local"
            echo "Permissions in the merged manifest:"
            grep -o "android.permission.[A-Z_]*" "$MERGED_EQ" | sort -u || true
          else
            echo "WARN: merged manifest not found; falling back to aapt2 output"
            if ! grep -q "android.permission.INTERNET" "$WORK/eq-perms-aapt.txt"; then
              echo "FAIL: PulseEQ update checker requires INTERNET"
              exit 1
            fi
            echo "OK: update-check INTERNET permission in aapt2 dump"
          fi

          if [ -n "$MERGED_EQ" ] && grep -q "EqService" "$MERGED_EQ"; then
            echo "OK: the background equalizer service is declared"
            grep -o 'android:name="[^"]*EqService"' "$MERGED_EQ" | head -2 || true
          elif [ -n "$AAPT" ] && "$AAPT" dump xmltree --file AndroidManifest.xml "$EQ" 2>/dev/null | grep -q "EqService"; then
            echo "OK: the background equalizer service is declared (aapt2)"
          else
            echo "FAIL: EqService could not be found in the equalizer manifest"
            exit 1
          fi

          for symbol in PeakingBiquad EqEngine SessionEffectReceiver Bands; do
            if grep -aq "$symbol" "$WORK/eq.dex"; then
              echo "OK: $symbol is in the equalizer APK"
            else
              echo "FAIL: $symbol is missing from the equalizer APK"
              exit 1
            fi
          done

          echo "=== Ramesh Radio checks ==="
          if [ -n "$MERGED_RADIO" ]; then
            if grep -q "android.permission.INTERNET" "$MERGED_RADIO"; then
              echo "OK: INTERNET permission present (streaming)"
            else
              echo "FAIL: Ramesh Radio cannot stream without INTERNET"
              exit 1
            fi
            if grep -q "FOREGROUND_SERVICE_MEDIA_PLAYBACK" "$MERGED_RADIO"; then
              echo "OK: foreground media playback permission declared"
            else
              echo "FAIL: background playback permission missing"
              exit 1
            fi
            if grep -q "READ_MEDIA_AUDIO" "$MERGED_RADIO"; then
              echo "OK: local audio permission declared"
            else
              echo "FAIL: local audio permission missing"
              exit 1
            fi
            if grep -q "androidx.media3.session.MediaSessionService" "$MERGED_RADIO"; then
              echo "OK: the Media3 playback service is declared"
            else
              echo "FAIL: no MediaSessionService intent filter in the manifest"
              exit 1
            fi
            if grep -qi "accessibilityservice" "$MERGED_RADIO"; then
              echo "FAIL: Ramesh Radio must not declare an Accessibility service"
              exit 1
            fi
            echo "OK: no Accessibility service"
            echo "Permissions in the merged manifest:"
            grep -o "android.permission.[A-Z_]*" "$MERGED_RADIO" | sort -u || true
          else
            echo "FAIL: could not find the merged manifest for :radio"
            exit 1
          fi

          if grep -q "com.universalrp.tamilnadufm.widget.RadioWidgetProvider" "$MERGED_RADIO"; then
            echo "OK: the home-screen widget receiver is declared in the manifest"
          else
            echo "FAIL: the widget receiver is missing from the merged manifest"
            exit 1
          fi
          # v1.2 rule: the language menu reads தமிழ் and it is the first selection.
          if grep -aq "தமிழ்" "$WORK/radio.dex"; then
            echo "OK: the தமிழ் menu label is inside the radio APK"
          else
            echo "FAIL: the தமிழ் menu label is missing from the radio APK"
            exit 1
          fi

          if unzip -l "$RADIO" | grep -q "res/xml/radio_widget_info.xml" || \
             unzip -l "$RADIO" | grep -q "res/.*/radio_widget_info.xml"; then
            echo "OK: the widget info is packaged in the APK"
          else
            echo "FAIL: res/xml/radio_widget_info.xml is not packaged in the APK"
            exit 1
          fi

          for symbol in PlaybackService AudioFx EqPresets StationRepository MainViewModel DirectoryClient RadioWidgetProvider; do
            if grep -aq "$symbol" "$WORK/radio.dex"; then
              echo "OK: $symbol is in the Ramesh Radio APK"
            else
              echo "FAIL: $symbol is missing from the radio APK"
              exit 1
            fi
          done

          if unzip -p "$RADIO" "assets/stations_seed.json" > "$WORK/seed.json" 2>/dev/null && [ -s "$WORK/seed.json" ]; then
            echo "OK: the station seed list is packaged ($(wc -c < "$WORK/seed.json") bytes)"
          else
            echo "FAIL: assets/stations_seed.json is not packaged in the APK"
            exit 1
          fi
          if python3 tools/check_seed.py "$WORK/seed.json"; then
            echo "OK: seed list parsed and contains Tamil + news stations"
          else
            echo "FAIL: the seed list could not be parsed"
            exit 1
          fi

          echo "=== RP VOCAL REMOVER STUDIO checks (debug and signed release) ==="
          if [ -z "$MERGED_VOCAL" ]; then
            echo "FAIL: could not find the merged manifest for :vocalremover"; exit 1
          fi
          for permission in android.permission.INTERNET android.permission.FOREGROUND_SERVICE \
                            android.permission.FOREGROUND_SERVICE_DATA_SYNC \
                            android.permission.FOREGROUND_SERVICE_MEDIA_PROCESSING \
                            android.permission.WAKE_LOCK android.permission.REQUEST_INSTALL_PACKAGES; do
            if grep -q "$permission" "$MERGED_VOCAL"; then
              echo "OK: Vocal Remover declares $permission"
            else
              echo "FAIL: Vocal Remover is missing $permission"; exit 1
            fi
          done
          grep -q 'com.universalrp.vocalremover.processing.SeparationService' "$MERGED_VOCAL" || { echo "FAIL: on-device processing foreground service is not declared"; exit 1; }
          grep -q 'androidx.core.content.FileProvider' "$MERGED_VOCAL" || { echo "FAIL: verified APK hand-off FileProvider is not declared"; exit 1; }
          grep -q 'android:exported="false"' "$MERGED_VOCAL" || { echo "FAIL: verified APK provider must not be exported"; exit 1; }
          grep -q 'app_update_paths' "$MERGED_VOCAL" || { echo "FAIL: private verified-update cache paths are not declared"; exit 1; }
          for dex in "$WORK/vocal-remover-debug.dex" "$WORK/vocal-remover-release.dex"; do
            for symbol in ProcessingQueue ProcessingPolicy ChunkedSeparationProcessor \
                          WavPlaybackController ModelRepository DeviceMonitor SeparationService \
                          AppUpdates AppLanguage PcmWavToMp3Encoder; do
              if grep -aq "$symbol" "$dex"; then
                echo "OK: $symbol is present in $(basename "$dex")"
              else
                echo "FAIL: $symbol is missing from $(basename "$dex")"; exit 1
              fi
            done
          done
          echo "OK: Vocal Remover ships standalone signed bytes, local-processing runtime, and verified updater"

          # Store listing inventory. Warnings only: F-Droid shows a listing without
          # screenshots, it simply looks bare, and a missing icon is a polish problem, not a
          # broken build. Printed every run so the gap is always visible.
          echo "=== Store listing inventory (warnings) ==="
          for m in cleaner equalizer radio; do
            d="$m/fastlane/metadata/android"
            if [ ! -d "$d" ]; then
              echo "WARN: $m has no fastlane listing at all"
              continue
            fi
            shots=$(ls "$d"/*/images/phoneScreenshots/*.png "$d"/*/images/phoneScreenshots/*.jpg 2>/dev/null | wc -l | tr -d ' ')
            icon=$(ls "$d"/*/images/icon.png 2>/dev/null | wc -l | tr -d ' ')
            graphic=$(ls "$d"/*/images/featureGraphic.png 2>/dev/null | wc -l | tr -d ' ')
            locales=$(ls "$d" | tr '\n' ' ')
            echo "$m: locales=[$locales] screenshots=$shots icon=$icon featureGraphic=$graphic"
            if [ "$shots" -lt 2 ]; then
              echo "WARN: $m has fewer than 2 phone screenshots - the store page will show no gallery"
            fi
            if [ "$icon" -eq 0 ]; then
              echo "WARN: $m has no 512x512 icon.png in its listing - 'Make the store icons' should have written it"
            fi
          done

          echo "ALL CHECKS PASSED"

      # v2.6: the user asked for the downloaded file to carry the version instead of
      # "cleaner-debug.apk". The name is read from each module's own versionName, so it can
      # never drift away from the app version, and the old generic name is gone afterwards.
      - name: Give the APKs versioned file names
        run: |
          set -e
          version_of() {
            grep -m1 'versionName' "$1" | sed -E 's/.*"([^"]+)".*/\1/'
          }
          rename_apk() {
            module="$1"; pretty="$2"; variant="$3"; suffix="$4"
            src=$(ls "$module"/build/outputs/apk/"$variant"/*.apk 2>/dev/null | head -1 || true)
            if [ -z "$src" ]; then
              echo "No APK produced for $module — nothing to rename."
              return 0
            fi
            ver=$(version_of "$module/build.gradle.kts")
            if [ -z "$ver" ]; then ver="debug"; fi
            dst="$(dirname "$src")/${pretty}-v${ver}${suffix}.apk"
            mv "$src" "$dst"
            echo "renamed: $dst"
          }
          rename_apk cleaner   CleanSweep      release ""
          rename_apk radio     Ramesh-Radio    release ""
          rename_apk equalizer PulseEQ         release ""
          rename_apk vocalremover RP-Vocal-Remover-Studio release ""
          rename_apk cleaner   CleanSweep      debug   "-debug"
          rename_apk radio     Ramesh-Radio    debug   "-debug"
          rename_apk equalizer PulseEQ         debug   "-debug"
          rename_apk vocalremover RP-Vocal-Remover-Studio debug "-debug"
          echo "=== APK file names ==="
          ls -la */build/outputs/apk/*/*.apk

      # Candidate evidence: the exact bytes this run produced, so a device test can be tied to
      # one APK digest instead of "roughly this version". The record is committed only on
      # candidate branches; a published release carries GitHub's own asset digests.
      - name: Record candidate APK digests
        env:
          RELEASE_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' || inputs.mirror_existing)) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish]')) }}
        run: |
          set -e
          RECORD=docs/candidate-build-digests.md
          {
            echo "# Candidate build digests"
            echo ""
            echo "- Workflow run: ${{ github.run_id }}"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Ref: $GITHUB_REF"
            echo "- Built (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Note: candidate build output only. GitHub publication is not Play Protect approval."
            echo ""
            echo "| File | Bytes | SHA-256 |"
            echo "| --- | --- | --- |"
          } > "$RECORD"
          {
            echo "## Candidate APK digests (run ${{ github.run_id }})"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for f in */build/outputs/apk/*/*.apk */build/outputs/bundle/release/*.aab; do
            [ -f "$f" ] || continue
            size=$(stat -c '%s' "$f")
            sha=$(sha256sum "$f" | awk '{print $1}')
            printf '| `%s` | %s | `%s` |\n' "$f" "$size" "$sha" >> "$RECORD"
            echo "SHA-256 $sha  $f"
            sha256sum "$f" > "$f.sha256"
          done
          sed -n '1,20p' "$RECORD"
          { echo '```'; cat "$RECORD"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" == refs/heads/arena/* && "$RELEASE_REQUESTED" != "true" ]]; then
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add -f "$RECORD"
            if git diff --cached --quiet; then
              echo "Digest record unchanged."
            else
              git commit -q -m "CI: record candidate build digests (run ${{ github.run_id }})"
              for attempt in 1 2 3 4 5; do
                git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
                if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                  echo "Digest record pushed."
                  break
                fi
                echo "push attempt $attempt failed; retrying..."
                sleep 6
              done
            fi
          else
            echo "Publication run or non-candidate ref; digest record stays local to this run."
          fi

      # Publishing: after all checks pass, publish one stable, version-specific APK release
      # for each app, or mirror the exact existing bridge APKs without altering old releases.
      - name: Publish or mirror verified releases for four apps
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' || inputs.mirror_existing)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/') && contains(github.event.head_commit.message, '[publish]'))
        env:
          GH_TOKEN: ${{ github.token }}
          RP_ANDROID_APPS_RELEASE_TOKEN: ${{ secrets.RP_ANDROID_APPS_RELEASE_TOKEN }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          MIRROR_EXISTING: ${{ inputs.mirror_existing }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/release-publication.log") 2>&1
          if [[ -n "${REQUESTED_TAG:-}" ]]; then BATCH_TAG="$REQUESTED_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then BATCH_TAG="$GITHUB_REF_NAME"
          else BATCH_TAG="v$(date -u +%Y.%m.%d)"; fi
          [[ "$BATCH_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]] || { echo "Invalid release batch tag"; exit 1; }

          # Preserve the old endpoint for installed clients and publish the same verified APK
          # bytes to the new-first destination. Destination access and its scoped write secret are
          # checked before any draft is created; fail closed rather than publish old-source only.
          DESTINATION_REPO="universalrp2003/RP-Android-Apps"
          if ! DESTINATION_INFO=$(gh api "repos/${DESTINATION_REPO}" --jq '[.private, .default_branch, .archived] | @tsv'); then
            echo "FAIL: RP-Android-Apps is not reachable; refusing to publish bridge releases."
            exit 1
          fi
          IFS=$'\t' read -r DESTINATION_PRIVATE DESTINATION_BRANCH DESTINATION_ARCHIVED <<< "$DESTINATION_INFO"
          if [[ "$DESTINATION_PRIVATE" != "false" || -z "$DESTINATION_BRANCH" || "$DESTINATION_BRANCH" == "null" || "$DESTINATION_ARCHIVED" != "false" ]]; then
            echo "FAIL: RP-Android-Apps must be public, initialized and unarchived before bridge publication."
            exit 1
          fi
          if ! gh api "repos/${DESTINATION_REPO}/releases?per_page=1" >/dev/null; then
            echo "FAIL: RP-Android-Apps release API is not readable; refusing to publish bridge releases."
            exit 1
          fi
          TARGET_PUBLISH_ENABLED=false
          if [[ -n "${RP_ANDROID_APPS_RELEASE_TOKEN:-}" ]]; then
            TARGET_PUSH=$(GH_TOKEN="$RP_ANDROID_APPS_RELEASE_TOKEN" gh api "repos/${DESTINATION_REPO}" --jq '.permissions.push // false') || {
              echo "FAIL: the RP-Android-Apps release token cannot read its destination repository."
              exit 1
            }
            if [[ "$TARGET_PUSH" != "true" ]]; then
              echo "FAIL: RP-ANDROID_APPS_RELEASE_TOKEN must have contents:write access to RP-Android-Apps."
              exit 1
            fi
            TARGET_PUBLISH_ENABLED=true
            echo "OK: target release mirroring is enabled with write access."
          else
            echo "::error::Dual-repository release is blocked. Configure the InternetRadio Actions secret RP_ANDROID_APPS_RELEASE_TOKEN with contents:write access to RP-Android-Apps; no release drafts have been created. Do not paste the secret into chat."
            exit 1
          fi
          if [[ "${MIRROR_EXISTING:-false}" == "true" && "$TARGET_PUBLISH_ENABLED" != "true" ]]; then
            echo "FAIL: mirror_existing requires RP_ANDROID_APPS_RELEASE_TOKEN with RP-Android-Apps contents:write access."
            exit 1
          fi

          # Never publish a stale branch candidate after a newer fix has been pushed.
          if [[ "$GITHUB_REF" == refs/heads/arena/* ]]; then
            REMOTE_SOURCE=$(git ls-remote origin "$GITHUB_REF" | awk '{print $1}')
            if [[ "$REMOTE_SOURCE" != "$GITHUB_SHA" ]]; then
              echo "A newer branch source exists; refusing stale-candidate publication."
              exit 1
            fi
          fi

          version_of() { grep -m1 'versionName' "$1" | sed -E 's/.*"([^"]+)".*/\1/'; }
          CLEANER_VERSION=$(version_of cleaner/build.gradle.kts)
          RADIO_VERSION=$(version_of radio/build.gradle.kts)
          EQ_VERSION=$(version_of equalizer/build.gradle.kts)
          VOCAL_VERSION=$(version_of vocalremover/build.gradle.kts)
          LIVE_GUARD_TAG="live-guard-v${CLEANER_VERSION}"
          RADIO_TAG="ramesh-radio-v${RADIO_VERSION}"
          EQ_TAG="pulseeq-v${EQ_VERSION}"
          VOCAL_TAG="rp-vocal-remover-studio-v${VOCAL_VERSION}"
          CLEANER_REL="cleaner/build/outputs/apk/release/CleanSweep-v${CLEANER_VERSION}.apk"
          RADIO_REL="radio/build/outputs/apk/release/Ramesh-Radio-v${RADIO_VERSION}.apk"
          EQ_REL="equalizer/build/outputs/apk/release/PulseEQ-v${EQ_VERSION}.apk"
          VOCAL_REL="vocalremover/build/outputs/apk/release/RP-Vocal-Remover-Studio-v${VOCAL_VERSION}.apk"
          LIVE_NOTES="releases/${LIVE_GUARD_TAG}.md"
          RADIO_NOTES="releases/${RADIO_TAG}.md"
          EQ_NOTES="releases/${EQ_TAG}.md"
          VOCAL_NOTES="releases/${VOCAL_TAG}.md"

          for file in "$CLEANER_REL" "$RADIO_REL" "$EQ_REL" "$VOCAL_REL" \
                      "$LIVE_NOTES" "$RADIO_NOTES" "$EQ_NOTES" "$VOCAL_NOTES"; do
            test -f "$file" || { echo "Missing verified release input: $file"; exit 1; }
          done
          # The strict Live Guard permission/device-evidence check above remains mandatory;
          # notes must also be explicit if these exact candidate bytes were not device-tested.
          if ! grep -Eiq 'not installed on a phone|no physical-device test|no device test' "$LIVE_NOTES"; then
            echo "FAIL: Live Guard notes must state honestly whether this exact build had a device test."; exit 1
          fi

          # ---------------------------------------------------------------------------
          # Device-evidence gate. Revised by explicit owner decision on 12 October 2026
          # (Live Guard 2.42). DELIBERATE: do not delete or weaken this block to publish.
          #
          # A CleanSweep candidate newer than the published 2.39/code44 needs a recorded
          # physical-device install ONLY when it ADDS a dangerous permission compared with
          # the previously published release APK. The comparison is made on the built
          # artifacts with aapt2, because only the merged manifest shows what the phone is
          # actually asked to grant; tools/verify_release_permission_delta.py decides, and
          # it fails closed when the previous release cannot be downloaded or read.
          #
          # Everything else from the original rule is unchanged and still enforced below:
          # when a device-evidence file DOES exist, publication uses exactly the tested
          # bytes - a rebuild reproducing the recorded SHA-256, or the recorded run's
          # promoted artifact - so a rebuilt digest can never inherit an earlier device
          # test. GitHub publication is not Play Protect approval and not all-device
          # certification, and release notes must never claim a device test that did not
          # happen. Play Protect, the package name and the signing key are untouched.
          # ---------------------------------------------------------------------------
          CLEANER_REL=$(ls cleaner/build/outputs/apk/release/*.apk | head -1)
          CLEANER_VERSION=$(grep -m1 'versionName' cleaner/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          CLEANER_CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' cleaner/build.gradle.kts)
          # This is a separate step from "Verify built APKs", so its tools are not inherited.
          AAPT2=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ "${CLEANER_CODE:-0}" -gt 44 ] && [[ "${MIRROR_EXISTING:-false}" != "true" ]]; then
            EVIDENCE="docs/live-guard-${CLEANER_VERSION}-device-evidence.md"
            # --- 2.42: does THIS release need a recorded device install? --------------
            if [ -z "$AAPT2" ]; then
              echo "FAIL: aapt2 is required to compare the released permissions; refusing to guess."
              exit 1
            fi
            "$AAPT2" dump badging "$CLEANER_REL" > "$RUNNER_TEMP/candidate-badging.txt"
            PREVIOUS_TAG=$(cat releases/latest-tag.txt)
            PREVIOUS_DIR="$RUNNER_TEMP/previous-release"
            PREVIOUS_BADGING=""
            mkdir -p "$PREVIOUS_DIR"
            if [ "$PREVIOUS_TAG" = "$LIVE_GUARD_TAG" ]; then
              echo "WARN: releases/latest-tag.txt already points at $LIVE_GUARD_TAG; there is no earlier release to compare."
            elif gh release download "$PREVIOUS_TAG" --dir "$PREVIOUS_DIR" --pattern 'CleanSweep-*.apk' >/dev/null 2>&1; then
              PREVIOUS_APK=$(find "$PREVIOUS_DIR" -name 'CleanSweep-*.apk' | head -1)
              if [ -n "$PREVIOUS_APK" ] && "$AAPT2" dump badging "$PREVIOUS_APK" > "$RUNNER_TEMP/previous-badging.txt"; then
                PREVIOUS_BADGING="$RUNNER_TEMP/previous-badging.txt"
                echo "Comparing against the previously published release: $PREVIOUS_TAG ($(basename "$PREVIOUS_APK"))"
              fi
            else
              echo "WARN: could not download the CleanSweep APK published as $PREVIOUS_TAG."
            fi
            DELTA_ARGS=(--candidate-badging "$RUNNER_TEMP/candidate-badging.txt")
            if [ -n "$PREVIOUS_BADGING" ]; then
              DELTA_ARGS+=(--previous-badging "$PREVIOUS_BADGING")
            else
              # Fail closed: an unreadable previous release is never treated as "nothing added".
              DELTA_ARGS+=(--previous-unavailable "the CleanSweep APK published as $PREVIOUS_TAG could not be read")
            fi
            if [ -f "$EVIDENCE" ]; then DELTA_ARGS+=(--evidence-present); fi
            python3 tools/verify_release_permission_delta.py "${DELTA_ARGS[@]}" | tee "$RUNNER_TEMP/permission-delta.txt"
            EVIDENCE_REQUIRED=$(sed -nE 's/^EVIDENCE-REQUIRED: (yes|no)$/\1/p' "$RUNNER_TEMP/permission-delta.txt" | head -1)
            # Anything other than an explicit "no" is treated as "required": fail closed.
            if [ "$EVIDENCE_REQUIRED" != "no" ] && [ ! -f "$EVIDENCE" ]; then
              echo "FAIL: CleanSweep $CLEANER_VERSION (code $CLEANER_CODE) adds a dangerous permission and has no recorded physical-device evidence."
              echo "       Expected: $EVIDENCE"
              echo "       Install the exact candidate APK from the normal download route with Play Protect ON,"
              echo "       record the real outcome, and commit that record before publishing. Nothing was published."
              exit 1
            fi
            if [ ! -f "$EVIDENCE" ]; then
              echo "OK: $CLEANER_VERSION adds no dangerous permission, so no device-install record is required."
              echo "    The freshly built bytes are published. No device test is claimed for them: the"
              echo "    release notes and CHANGELOG must say plainly that this build was not installed on a phone."
            else
              if ! grep -Eqi "play protect" "$EVIDENCE" || ! grep -Eqi "installer|installation outcome" "$EVIDENCE"; then
                echo "FAIL: $EVIDENCE must record both the actual Play Protect result and the installer outcome."
                exit 1
              fi
              TESTED_SHA=$(sed -nE 's/^TESTED-APK-SHA256:[[:space:]]*([0-9a-fA-F]{64}).*/\1/p' "$EVIDENCE" | head -1 | tr 'A-F' 'a-f')
              TESTED_RUN=$(sed -nE 's/^TESTED-RUN-ID:[[:space:]]*([0-9]+).*/\1/p' "$EVIDENCE" | head -1)
              if [ -z "$TESTED_SHA" ]; then
                echo "FAIL: $EVIDENCE has no machine-readable 'TESTED-APK-SHA256:' line, so the tested bytes cannot be identified."
                echo "       Fill the evidence template's TESTED-APK-SHA256 / TESTED-RUN-ID lines. Nothing was published."
                exit 1
              fi
              CANDIDATE_SHA=$(sha256sum "$CLEANER_REL" | awk '{print $1}')
              if [ "$CANDIDATE_SHA" = "$TESTED_SHA" ]; then
                echo "OK: this build reproduces the device-tested APK digest exactly ($TESTED_SHA); nothing to promote."
              else
                # A rebuild does not reproduce those bytes. Promote the artifact from the run that
                # the owner actually tested instead of publishing untested bytes.
                if [ -z "$TESTED_RUN" ]; then
                  echo "FAIL: this build's digest differs from the device-tested digest and no TESTED-RUN-ID is recorded."
                  echo "       built:  $CANDIDATE_SHA"
                  echo "       tested: $TESTED_SHA"
                  echo "       Record the run id whose artifact was installed, or the tested bytes cannot be published. Nothing was published."
                  exit 1
                fi
                PROMOTE="$RUNNER_TEMP/promoted-cleansweep"
                mkdir -p "$PROMOTE"
                if ! gh run download "$TESTED_RUN" -n cleansweep-apk -D "$PROMOTE"; then
                  echo "FAIL: could not download the tested run's cleansweep-apk artifact (run $TESTED_RUN)."
                  echo "       Expired/deleted artifacts cannot be re-published; rebuild, re-test on the phone and record the new run. Nothing was published."
                  exit 1
                fi
                PROMOTED_APK=$(find "$PROMOTE" -type f -path '*/release/*.apk' | head -1)
                if [ -z "$PROMOTED_APK" ]; then
                  echo "FAIL: the tested run's artifact has no release APK to promote."
                  exit 1
                fi
                PROMOTED_SHA=$(sha256sum "$PROMOTED_APK" | awk '{print $1}')
                if [ "$PROMOTED_SHA" != "$TESTED_SHA" ]; then
                  echo "FAIL: the promoted artifact digest does not match the recorded device-test digest."
                  echo "       artifact: $PROMOTED_SHA"
                  echo "       evidence: $TESTED_SHA"
                  exit 1
                fi
                # Same version/package expectations, checked on the promoted bytes themselves.
                if [ -z "$AAPT2" ]; then
                  echo "FAIL: aapt2 is required to verify the promoted APK's version; cannot promote safely."
                  exit 1
                fi
                if ! "$AAPT2" dump badging "$PROMOTED_APK" | grep -Fq "versionCode='$CLEANER_CODE'"; then
                  echo "FAIL: the promoted APK's versionCode does not match the source version code."
                  exit 1
                fi
                if ! "$AAPT2" dump badging "$PROMOTED_APK" | grep -Fq "versionName='$CLEANER_VERSION'"; then
                  echo "FAIL: the promoted APK's versionName does not match the source version name."
                  exit 1
                fi
                cp "$PROMOTED_APK" "$CLEANER_REL"
                echo "OK: promoted the device-tested artifact from run $TESTED_RUN ($PROMOTED_SHA) as the publication APK"
                # The store bundle travels with the same tested build.
                PROMOTE_BUNDLE="$RUNNER_TEMP/promoted-bundles"
                mkdir -p "$PROMOTE_BUNDLE"
                if gh run download "$TESTED_RUN" -n store-bundles -D "$PROMOTE_BUNDLE"; then
                  PROMOTED_AAB=$(find "$PROMOTE_BUNDLE" -type f -path '*/cleaner/*.aab' | head -1)
                  if [ -n "$PROMOTED_AAB" ]; then
                    cp "$PROMOTED_AAB" cleaner/build/outputs/bundle/release/
                    echo "OK: promoted the matching CleanSweep bundle from run $TESTED_RUN"
                  else
                    echo "WARN: the tested run's bundle artifact has no CleanSweep .aab; the freshly built bundle is published"
                  fi
                else
                  echo "WARN: could not download the tested run's store-bundles artifact; the freshly built bundle is published"
                fi
              fi
              if ! grep -Fq "$TESTED_SHA" "$EVIDENCE"; then
                echo "FAIL: $EVIDENCE no longer contains the tested digest; refusing to publish."
                exit 1
              fi
              echo "OK: device evidence in $EVIDENCE covers the published CleanSweep $CLEANER_VERSION APK ($TESTED_SHA)"
            fi
          elif [[ "${MIRROR_EXISTING:-false}" == "true" ]]; then
            echo "Mirror-only mode: the freshly built candidate is not being released. The already-public InternetRadio APK must pass its own size and SHA-256 checks before copying."
          fi
          RELEASE_TAGS=("$LIVE_GUARD_TAG" "$RADIO_TAG" "$EQ_TAG" "$VOCAL_TAG")
          if [[ "$TARGET_PUBLISH_ENABLED" == "true" ]]; then
            for release_tag in "${RELEASE_TAGS[@]}"; do
              if GH_TOKEN="$RP_ANDROID_APPS_RELEASE_TOKEN" gh release view "$release_tag" --repo "$DESTINATION_REPO" >/dev/null 2>&1 || \
                 GH_TOKEN="$RP_ANDROID_APPS_RELEASE_TOKEN" gh api "repos/${DESTINATION_REPO}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
                echo "Target release tag already exists: $release_tag; refusing to overwrite it."
                exit 1
              fi
            done
          fi
          for release_tag in "${RELEASE_TAGS[@]}"; do
            if [[ "${MIRROR_EXISTING:-false}" == "true" ]]; then
              if ! SOURCE_RELEASE_STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --jq '[.draft, .prerelease] | @tsv'); then
                echo "Mirror source release is missing on InternetRadio: $release_tag"; exit 1
              fi
              IFS=$'\t' read -r SOURCE_IS_DRAFT SOURCE_IS_PRERELEASE <<< "$SOURCE_RELEASE_STATUS"
              if [[ "$SOURCE_IS_DRAFT" != "false" || "$SOURCE_IS_PRERELEASE" != "false" ]]; then
                echo "Mirror source release must be stable and public: $release_tag"; exit 1
              fi
            else
              if gh release view "$release_tag" >/dev/null 2>&1; then
                echo "Release already exists: $release_tag; use new app versions/tags instead of overwriting it."; exit 1
              fi
              if git ls-remote --exit-code origin "refs/tags/$release_tag" >/dev/null 2>&1; then
                echo "Git tag already exists without a release: $release_tag; refusing to repurpose it."; exit 1
              fi
            fi
          done

          RELEASE_APKS=("$CLEANER_REL" "$RADIO_REL" "$EQ_REL" "$VOCAL_REL")
          RELEASE_NOTES=("$LIVE_NOTES" "$RADIO_NOTES" "$EQ_NOTES" "$VOCAL_NOTES")
          RELEASE_TITLES=("Live Guard $CLEANER_VERSION" "Ramesh Radio $RADIO_VERSION" "PulseEQ $EQ_VERSION" "RP VOCAL REMOVER STUDIO $VOCAL_VERSION")
          if [[ "${MIRROR_EXISTING:-false}" != "true" ]]; then
            for i in "${!RELEASE_TAGS[@]}"; do
              release_tag="${RELEASE_TAGS[$i]}"
              echo "Creating private draft: $release_tag (${RELEASE_APKS[$i]})"
              gh release create "$release_tag" --target "$GITHUB_SHA" --draft \
                --title "${RELEASE_TITLES[$i]}" --notes-file "${RELEASE_NOTES[$i]}"
              gh release upload "$release_tag" "${RELEASE_APKS[$i]}"
            done
          else
            echo "Mirror mode: leaving all existing InternetRadio releases, tags and assets unchanged."
          fi

          verify_release_asset() {
            release_tag="$1"
            apk="$2"
            expected_draft="$3"
            response_pages="$RUNNER_TEMP/release-${release_tag}-pages.json"
            # GitHub's release-by-tag endpoint intentionally hides draft releases (404).
            # The authenticated release list includes drafts, so resolve the unique tag there.
            if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$response_pages"; then
              echo "FAIL: could not list GitHub releases while verifying $release_tag"
              return 1
            fi
            python3 - "$response_pages" "$release_tag" "$apk" "$expected_draft" <<'PY'
          import hashlib, json, pathlib, sys
          response_path, tag, apk_path, expected_draft = sys.argv[1:]
          pages = [json.loads(line) for line in pathlib.Path(response_path).read_text().splitlines() if line.strip()]
          releases = [release for page in pages for release in page]
          matches = [item for item in releases if item.get("tag_name") == tag]
          assert len(matches) == 1, f"expected one release for {tag}, found {len(matches)}"
          release = matches[0]
          apk = pathlib.Path(apk_path)
          name = apk.name
          expected_url = f"https://github.com/universalrp2003/InternetRadio/releases/download/{tag}/{name}"
          expected_page = f"https://github.com/universalrp2003/InternetRadio/releases/tag/{tag}"
          expected_digest = "sha256:" + hashlib.sha256(apk.read_bytes()).hexdigest()
          is_draft = expected_draft == "true"
          assert release.get("tag_name") == tag, f"wrong tag in release API response: {tag}"
          assert release.get("draft") is is_draft, f"unexpected draft state: {release.get('draft')}"
          assert release.get("prerelease") is False, "release is marked prerelease"
          if is_draft:
              # GitHub assigns an untagged-<id> URL to drafts until the tag is published.
              assert release.get("html_url", "").startswith("https://github.com/universalrp2003/InternetRadio/releases/tag/")
          else:
              assert release.get("html_url") == expected_page, f"non-canonical release page: {release.get('html_url')}"
          assets = [asset for asset in release.get("assets", []) if asset.get("name") == name]
          assert len(assets) == 1, f"expected exactly one {name} asset"
          asset = assets[0]
          assert asset.get("state") == "uploaded", f"asset is not uploaded: {asset.get('state')}"
          assert asset.get("size") == apk.stat().st_size, "release asset size differs from the locally verified APK"
          assert asset.get("digest") == expected_digest, f"GitHub SHA-256 differs: {asset.get('digest')} != {expected_digest}"
          download_url = asset.get("browser_download_url", "")
          assert download_url.startswith("https://github.com/universalrp2003/InternetRadio/releases/download/") and download_url.endswith("/" + name), f"non-canonical download host or asset: {download_url}"
          if not is_draft:
              assert download_url == expected_url, f"published download URL is not canonical: {download_url}"
          print(f"VERIFIED {'DRAFT' if is_draft else 'PUBLIC'} {tag}: {name}, {asset['size']} bytes, {expected_digest}")
          PY
          }

          # Verify all old-source publication inputs. In mirror mode, download and validate the
          # existing public release assets first, then mirror those exact bytes without editing
          # any old release, tag or asset.
          if [[ "${MIRROR_EXISTING:-false}" == "true" ]]; then
            for i in "${!RELEASE_TAGS[@]}"; do
              release_tag="${RELEASE_TAGS[$i]}"
              source_dir="$RUNNER_TEMP/mirror-source-${release_tag}"
              mkdir -p "$source_dir"
              apk_name=$(basename "${RELEASE_APKS[$i]}")
              gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" \
                --dir "$source_dir" --pattern "$apk_name"
              source_apk="$source_dir/$apk_name"
              test -s "$source_apk" || { echo "Missing existing source asset: $release_tag/$apk_name"; exit 1; }
              RELEASE_APKS[$i]="$source_apk"
              verify_release_asset "$release_tag" "$source_apk" false
            done
          else
            # Verify each old-source draft before publication; GitHub assigns canonical tag URLs on promotion.
            for i in "${!RELEASE_TAGS[@]}"; do
              verify_release_asset "${RELEASE_TAGS[$i]}" "${RELEASE_APKS[$i]}" true
            done
          fi

          verify_target_release_asset() {
            release_tag="$1"
            apk="$2"
            expected_draft="$3"
            response_pages="$RUNNER_TEMP/target-release-${release_tag}-pages.json"
            if ! GH_TOKEN="$RP_ANDROID_APPS_RELEASE_TOKEN" gh api --paginate "repos/${DESTINATION_REPO}/releases?per_page=100" > "$response_pages"; then
              echo "FAIL: could not list RP-Android-Apps releases while verifying $release_tag"
              return 1
            fi
            python3 - "$response_pages" "$release_tag" "$apk" "$expected_draft" "$DESTINATION_REPO" <<'PY'
          import hashlib, json, pathlib, sys
          response_path, tag, apk_path, expected_draft, repo = sys.argv[1:]
          pages = [json.loads(line) for line in pathlib.Path(response_path).read_text().splitlines() if line.strip()]
          releases = [release for page in pages for release in page]
          matches = [item for item in releases if item.get("tag_name") == tag]
          assert len(matches) == 1, f"expected one {repo} release for {tag}, found {len(matches)}"
          release = matches[0]
          apk = pathlib.Path(apk_path)
          name = apk.name
          expected_url = f"https://github.com/{repo}/releases/download/{tag}/{name}"
          expected_page = f"https://github.com/{repo}/releases/tag/{tag}"
          expected_digest = "sha256:" + hashlib.sha256(apk.read_bytes()).hexdigest()
          is_draft = expected_draft == "true"
          assert release.get("draft") is is_draft, f"unexpected draft state: {release.get('draft')}"
          assert release.get("prerelease") is False, "release is marked prerelease"
          if is_draft:
              assert release.get("html_url", "").startswith(f"https://github.com/{repo}/releases/tag/")
          else:
              assert release.get("html_url") == expected_page, f"non-canonical release page: {release.get('html_url')}"
          assets = [asset for asset in release.get("assets", []) if asset.get("name") == name]
          assert len(assets) == 1, f"expected exactly one {name} asset"
          asset = assets[0]
          assert asset.get("state") == "uploaded", f"asset is not uploaded: {asset.get('state')}"
          assert asset.get("size") == apk.stat().st_size, "destination size differs from the verified APK"
          assert asset.get("digest") == expected_digest, f"destination SHA-256 differs: {asset.get('digest')} != {expected_digest}"
          download_url = asset.get("browser_download_url", "")
          assert download_url.startswith(f"https://github.com/{repo}/releases/download/") and download_url.endswith("/" + name), f"non-canonical destination asset: {download_url}"
          if not is_draft:
              assert download_url == expected_url, f"destination download URL is not canonical: {download_url}"
          print(f"VERIFIED {'DRAFT' if is_draft else 'PUBLIC'} {repo}/{tag}: {name}, {asset['size']} bytes, {expected_digest}")
          PY
          }

          if [[ "$TARGET_PUBLISH_ENABLED" == "true" ]]; then
            # Mirror the exact locally verified APK bytes; the destination repository contains
            # releases/assets, while source/build ownership remains on InternetRadio for now.
            for i in "${!RELEASE_TAGS[@]}"; do
              release_tag="${RELEASE_TAGS[$i]}"
              echo "Creating RP-Android-Apps draft: $release_tag (${RELEASE_APKS[$i]})"
              GH_TOKEN="$RP_ANDROID_APPS_RELEASE_TOKEN" gh release create "$release_tag" \
                --repo "$DESTINATION_REPO" --target "$DESTINATION_BRANCH" --draft \
                --title "${RELEASE_TITLES[$i]}" --notes-file "${RELEASE_NOTES[$i]}"
              GH_TOKEN="$RP_ANDROID_APPS_RELEASE_TOKEN" gh release upload "$release_tag" \
                "${RELEASE_APKS[$i]}" --repo "$DESTINATION_REPO"
            done
            for i in "${!RELEASE_TAGS[@]}"; do
              verify_target_release_asset "${RELEASE_TAGS[$i]}" "${RELEASE_APKS[$i]}" true
            done
          fi

          # Only publish after every old draft—and every configured target draft—has passed
          # its updater-facing size, SHA-256, stable-state and canonical-release checks.
          # Mirror mode deliberately leaves all existing InternetRadio releases untouched.
          if [[ "${MIRROR_EXISTING:-false}" != "true" ]]; then
            for release_tag in "${RELEASE_TAGS[@]}"; do
              gh release edit "$release_tag" --draft=false
            done
          fi
          if [[ "$TARGET_PUBLISH_ENABLED" == "true" ]]; then
            for release_tag in "${RELEASE_TAGS[@]}"; do
              GH_TOKEN="$RP_ANDROID_APPS_RELEASE_TOKEN" gh release edit "$release_tag" \
                --repo "$DESTINATION_REPO" --draft=false
            done
          fi
          for i in "${!RELEASE_TAGS[@]}"; do
            verify_release_asset "${RELEASE_TAGS[$i]}" "${RELEASE_APKS[$i]}" false
            if [[ "$TARGET_PUBLISH_ENABLED" == "true" ]]; then
              verify_target_release_asset "${RELEASE_TAGS[$i]}" "${RELEASE_APKS[$i]}" false
            fi
          done

          # Keep the previous-release pointer aligned for the next Live Guard permission delta.
          # This post-publication metadata commit does not change the just-verified APK bytes.
          if [[ "$GITHUB_REF" == refs/heads/arena/* ]]; then
            printf '%s\n' "$LIVE_GUARD_TAG" > releases/latest-tag.txt
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add releases/latest-tag.txt
            if ! git diff --cached --quiet; then
              git commit -m "CI: record latest Live Guard release $CLEANER_VERSION"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
          [[ "$TARGET_PUBLISH_ENABLED" == "true" ]] || { echo "FAIL: dual-repository publication was not enabled."; exit 1; }
          echo "All four stable app releases are published and their assets are verified on InternetRadio and RP-Android-Apps."

      - name: Surface build errors
        if: failure()
        run: |
          echo "::error::Build failed - details committed to ci-build-failure.md on this branch"

      # Commits whatever failed into ci-build-failure.md, so the reason is
      # readable straight from the repository (and from a phone).
      # A green build should not leave yesterday's failure report lying around.
      - name: Clear the stale failure report
        if: success()
        run: |
          if [ ! -f ci-build-failure.md ]; then
            echo "No stale report."
            exit 0
          fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git rm -q -f ci-build-failure.md
          git commit -q -m "CI: clear the build failure report (build is green again)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Stale report removed."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying…"
            sleep 6
          done
          echo "Could not push the cleanup commit; the report will be removed by the next run."

      - name: Publish build failure excerpt
        if: failure()
        run: |
          {
            echo "# CI build failure excerpt"
            echo ""
            if [ -f build.log ]; then
              echo "## Kotlin / resource errors"
              echo '```'
              grep -E "^e: " build.log | sed 's|file:///home/runner/work/InternetRadio/InternetRadio/||' | head -60 || true
              echo '```'
              echo ""
              echo "## Gradle summary"
              echo '```'
              grep -B2 -A30 -m1 "FAILURE: Build failed" build.log || true
              echo '```'
            else
              echo "_No Gradle build log: the failure happened before or after the build._"
            fi
            if [ -f verify.log ]; then
              echo ""
              echo "## APK verification output"
              echo '```'
              tail -80 verify.log || true
              echo '```'
            fi
            if [ -f store-art.log ]; then
              echo ""
              echo "## Store artwork step"
              echo '```'
              tail -60 store-art.log || true
              echo '```'
            fi
            if [ -f "$RUNNER_TEMP/release-publication.log" ]; then
              echo ""
              echo "## Release publication step"
              echo '```'
              tail -160 "$RUNNER_TEMP/release-publication.log" || true
              echo '```'
            fi
          } > ci-build-failure.md
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-build-failure.md
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "CI: publish build failure excerpt"
            # Another workflow (the station refresh) may have pushed to this
            # branch while the build was running, so rebase before pushing.
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Report pushed."
                break
              fi
              echo "Push attempt $attempt failed; retrying…"
              sleep 6
            done
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          # store-art.log matters when the failure is the artwork step, which runs before
          # Gradle and therefore leaves no build.log behind.
          path: |
            build.log
            verify.log
            store-art.log
          if-no-files-found: warn

      - name: Upload Google Play bundles (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: store-bundles
          path: |
            cleaner/build/outputs/bundle/release/*.aab
            equalizer/build/outputs/bundle/release/*.aab
            radio/build/outputs/bundle/release/*.aab

      - name: Upload CleanSweep APK
        uses: actions/upload-artifact@v4
        with:
          name: cleansweep-apk
          path: |
            cleaner/build/outputs/apk/*/*.apk
            cleaner/build/outputs/apk/*/*.apk.sha256

      - name: Upload PulseEQ APK
        uses: actions/upload-artifact@v4
        with:
          name: pulseeq-apk
          path: equalizer/build/outputs/apk/*/*.apk

      - name: Upload Ramesh Radio APK
        uses: actions/upload-artifact@v4
        with:
          name: ramesh-radio-apk
          path: radio/build/outputs/apk/*/*.apk

      - name: Upload RP Vocal Remover Studio APKs
        uses: actions/upload-artifact@v4
        with:
          name: rp-vocal-remover-studio-apks
          path: |
            vocalremover/build/outputs/apk/release/*.apk
            vocalremover/build/outputs/apk/release/*.apk.sha256
            vocalremover/build/outputs/apk/debug/*.apk
          if-no-files-found: error
