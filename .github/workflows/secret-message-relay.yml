# Test-only relay for Secret Message TEST builds: a Cloudflare Worker + Durable Object that forwards
# a test chat's MLS-encrypted bytes between two phones that cannot reach each other directly.
# Owner-approved test deployment (17 October 2026) to the owner's own Cloudflare account on the
# free plan, using the repository secret CLOUDFLARE_API_TOKEN (an account token, so wrangler finds the
# account itself). The relay stores and logs nothing; it is not security-reviewed.
name: Secret Message relay (test only)

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "secretmessage/relay/**"
      - ".github/workflows/secret-message-relay.yml"
  pull_request:
    paths:
      - "secretmessage/relay/**"
      - ".github/workflows/secret-message-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment half-way; queue the next one instead.
concurrency:
  group: secret-message-relay-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    name: Test the relay in the local Workers runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: secretmessage/relay
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: secretmessage/relay/package-lock.json

      - name: Install the pinned tools
        run: npm ci --no-audit --no-fund

      - name: Run the relay locally and check it over real WebSockets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --ip 127.0.0.1 --port 8787 --log-level warn > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS -m 2 http://127.0.0.1:8787/ 2>/dev/null | grep -q '^secretmessage-relay/1'; then break; fi
            sleep 1
          done
          if ! node test/relay-test.mjs ws://127.0.0.1:8787; then
            echo "::error title=relay-local::The relay checks failed in the local Workers runtime."
            tail -n 40 "$RUNNER_TEMP/wrangler-dev.log"
            exit 1
          fi

  deploy:
    name: Deploy to the owner's Cloudflare account and check it
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: secretmessage/relay
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: secretmessage/relay/package-lock.json

      - name: Install the pinned tools
        run: npm ci --no-audit --no-fund

      - name: Check the Cloudflare token secret
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # A pasted secret can end with a newline; spaces are never part of a token.
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          if [[ -z "$TOKEN" ]]; then
            echo "::error title=relay-secrets::The repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          echo "The Cloudflare token secret is present."

      - name: Deploy the relay
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # The token is an account token, so wrangler finds its one account by itself; the
          # CLOUDFLARE_ACCOUNT_ID secret is not used (its first value did not match the token).
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          unset CLOUDFLARE_ACCOUNT_ID
          set +e
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"
          result=${PIPESTATUS[0]}
          set -e
          if (( result != 0 )); then
            if grep -qi "workers.dev subdomain" "$RUNNER_TEMP/wrangler-deploy.log"; then
              echo "::error title=relay-deploy::The Cloudflare account has no workers.dev subdomain yet. Open Workers & Pages once (or deploy the Hello World Worker) and run this workflow again."
            fi
            # Keep account and token IDs (32 hex digits) out of the public annotations.
            details="$(grep -E 'ERROR|error|Authentication|permission|code: ' "$RUNNER_TEMP/wrangler-deploy.log" | head -n 15 \
              | sed -E 's/[0-9a-f]{32}/<id>/g')"
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=relay-deploy::wrangler deploy failed.%0A$details"
            exit "$result"
          fi
          url="$(grep -oE 'https://secretmessage-relay\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/wrangler-deploy.log" | head -n 1)"
          if [[ -z "$url" ]]; then
            echo "::error title=relay-deploy::wrangler deploy did not print a workers.dev address."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=relay-url::$url"

      - name: Check the deployed relay over real WebSockets
        shell: bash
        env:
          RELAY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 "$RELAY_URL/" 2>/dev/null | grep -q '^secretmessage-relay/1'; then break; fi
            sleep 2
          done
          set +e
          node test/relay-test.mjs "${RELAY_URL/https:/wss:}" > "$RUNNER_TEMP/relay-deployed.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/relay-deployed.log"
          summary="$(tail -n 1 "$RUNNER_TEMP/relay-deployed.log")"
          if (( result != 0 )); then
            failed="$(grep -E '^not ok|Error|error' "$RUNNER_TEMP/relay-deployed.log" | head -n 12 | sed -E 's/[0-9a-f]{32}/<id>/g')"
            failed="${failed//'%'/'%25'}"
            failed="${failed//$'\n'/'%0A'}"
            echo "::error title=relay-deployed-checks::$summary%0A$failed"
            exit "$result"
          fi
          echo "::notice title=relay-deployed-checks::$summary"
          {
            echo '### Secret Message relay (test only)'
            echo "- Address: \`${RELAY_URL/https:/wss:}\`"
            echo "- $summary"
            echo '- Forwards encrypted test-chat bytes between two phones; stores and logs nothing. Not security-reviewed.'
          } >> "$GITHUB_STEP_SUMMARY"
