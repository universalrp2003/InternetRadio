# Creates Secret Message's release signing key once, at the owner's request (17 October 2026).
#
# The key is generated here, inside CI, as a PKCS12 keystore protected by the repository secret
# SECRETMESSAGE_SIGNING_PASSWORD (chosen by the owner, at least 20 characters, never shown in chat or
# logs). Only the password-protected keystore and its certificate fingerprint are committed, to
# secretmessage/signing/, so later CI runs can sign every version with the same key. If the
# keystore already exists this workflow does nothing; it never replaces a key.
name: Secret Message signing key (one-time)

on:
  push:
    branches: [arena/d4fb2344-internetradio]
    paths:
      - ".github/workflows/secret-message-signing-key.yml"

permissions:
  contents: write

concurrency:
  group: secret-message-signing-key
  cancel-in-progress: false

jobs:
  create-key:
    name: Create the release key if it does not exist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Create, check and commit the password-protected keystore
        shell: bash
        env:
          PASSWORD: ${{ secrets.SECRETMESSAGE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="secretmessage/signing/secretmessage-release.p12"
          pin="secretmessage/signing/certificate-sha256.txt"
          if [[ -e "$keystore" ]]; then
            echo "::notice title=secretmessage-signing-key::The release key already exists; nothing was changed."
            exit 0
          fi
          # A pasted secret can end with a line break; it is never part of the password.
          PASSWORD="$(printf '%s' "$PASSWORD" | tr -d '\r\n')"
          if (( ${#PASSWORD} < 20 )); then
            echo "::error title=secretmessage-signing-key::The SECRETMESSAGE_SIGNING_PASSWORD secret is missing or shorter than 20 characters."
            exit 1
          fi
          export PASSWORD
          mkdir -p secretmessage/signing
          keytool -genkeypair -noprompt -keystore "$keystore" -storetype PKCS12 \
            -storepass:env PASSWORD -keypass:env PASSWORD -alias secretmessage \
            -keyalg RSA -keysize 4096 -sigalg SHA256withRSA -validity 36500 \
            -dname "CN=Secret Message, O=RP Ideas"
          keytool -exportcert -keystore "$keystore" -storetype PKCS12 -storepass:env PASSWORD \
            -alias secretmessage -file "$RUNNER_TEMP/secretmessage-release.der"
          fingerprint="$(sha256sum "$RUNNER_TEMP/secretmessage-release.der" | cut -d ' ' -f 1)"
          printf '%s\n' "$fingerprint" > "$pin"
          # The keystore must open with the password and hold exactly the one key entry.
          keytool -list -keystore "$keystore" -storetype PKCS12 -storepass:env PASSWORD | grep -q "secretmessage, .*PrivateKeyEntry"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$keystore" "$pin"
          git commit -q -m "Add the Secret Message release signing key (password-protected) [skip ci]" \
            -m "Created in CI by secret-message-signing-key.yml; certificate SHA-256 $fingerprint."
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "::notice title=secretmessage-signing-key::Created the release key; certificate SHA-256 $fingerprint."
