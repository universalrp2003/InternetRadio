name: Secret Message mls-rs candidate (test only)

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "secretmessage/native-mls-rs/**"
      - "secretmessage/native/src/android_jni.rs"
      - "secretmessage/android-smoke/build-android-smoke.sh"
      - "secretmessage/android-smoke/run-on-emulator.sh"
      - ".github/workflows/secret-message-mls-rs-candidate.yml"
  pull_request:
    paths:
      - "secretmessage/native-mls-rs/**"
      - "secretmessage/native/src/android_jni.rs"
      - "secretmessage/android-smoke/build-android-smoke.sh"
      - "secretmessage/android-smoke/run-on-emulator.sh"
      - ".github/workflows/secret-message-mls-rs-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-message-mls-rs-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_API_LEVEL: "26"

jobs:
  mls-rs-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17 for the standalone test APK
        id: setup_java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust 1.94.0 and Android targets
        id: setup_rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Generate and inspect the pinned mls-rs candidate lockfile
        id: candidate_lock
        continue-on-error: true
        working-directory: secretmessage/native-mls-rs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.lock ]]; then cargo generate-lockfile; fi
          cargo metadata --locked --features android-jni --format-version 1 > "$RUNNER_TEMP/mls-rs-metadata.json"
          rustc --version --verbose
          cargo --version
          grep -A2 -B2 -E '^name = "(mls-rs|mls-rs-crypto-awslc|aws-lc-rs|aws-lc-sys|openssl)"$' Cargo.lock \
            | tee "$RUNNER_TEMP/mls-rs-security-packages.txt" || true
          {
            echo '## mls-rs candidate: resolved protocol/provider packages'
            echo 'Published mls-rs 0.56.0 and AWS-LC provider 0.25.0 are pinned in the manifest; this is a separate test-only lockfile.'
            echo '```toml'
            cat "$RUNNER_TEMP/mls-rs-security-packages.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Format-check the mls-rs harness
        id: candidate_format
        continue-on-error: true
        working-directory: secretmessage/native-mls-rs
        run: cargo fmt -- --check

      - name: Run the candidate two-member in-memory MLS test
        id: candidate_test
        continue-on-error: true
        working-directory: secretmessage/native-mls-rs
        shell: bash
        run: |
          set +e
          cargo test --locked --features spike-harness 2>&1 | tee "$RUNNER_TEMP/mls-rs-test.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            details="$(tail -n 40 "$RUNNER_TEMP/mls-rs-test.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=mls-rs-host-test::$details"
          fi
          exit "$result"

      - name: Run candidate Clippy with warnings denied
        id: candidate_clippy
        continue-on-error: true
        working-directory: secretmessage/native-mls-rs
        run: cargo clippy --locked --all-targets --features spike-harness -- -D warnings

      - name: Type-check candidate JNI entry point on host
        id: candidate_jni_check
        continue-on-error: true
        working-directory: secretmessage/native-mls-rs
        run: cargo check --locked --features android-jni

      - name: Inspect the candidate Android dependency graph
        id: candidate_graph
        continue-on-error: true
        working-directory: secretmessage/native-mls-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --features android-jni --target aarch64-linux-android --edges normal,build --prefix none --format '{p}' \
            | sort -u | tee "$RUNNER_TEMP/mls-rs-android-dependencies.txt"
          grep -Eq '^mls-rs v0\.56\.0([[:space:]]|$)' "$RUNNER_TEMP/mls-rs-android-dependencies.txt"
          grep -Eq '^mls-rs-crypto-awslc v0\.25\.0([[:space:]]|$)' "$RUNNER_TEMP/mls-rs-android-dependencies.txt"
          if grep -Eq '^mls-rs-crypto-openssl v|^openssl v' "$RUNNER_TEMP/mls-rs-android-dependencies.txt"; then
            echo '::error title=Unexpected-OpenSSL-provider::The Android test graph must use the selected AWS-LC provider, not OpenSSL.'
            exit 1
          fi
          {
            echo '## mls-rs active Android normal/build dependency graph'
            echo 'The graph is required to contain the pinned mls-rs/AWS-LC versions and exclude the OpenSSL provider.'
            echo '```text'
            cat "$RUNNER_TEMP/mls-rs-android-dependencies.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit candidate lockfile against RustSec
        id: candidate_rustsec
        continue-on-error: true
        working-directory: secretmessage/native-mls-rs
        shell: bash
        run: |
          set +e
          cargo install cargo-audit --locked 2>&1 | tee "$RUNNER_TEMP/mls-rs-audit-install.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            details="$(tail -n 35 "$RUNNER_TEMP/mls-rs-audit-install.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=mls-rs-cargo-audit-install::$details"
            exit "$result"
          fi
          cargo audit 2>&1 | tee "$RUNNER_TEMP/mls-rs-audit.log"
          result=${PIPESTATUS[0]}
          if grep -Eq 'warning found|RUSTSEC-[0-9]{4}-[0-9]+' "$RUNNER_TEMP/mls-rs-audit.log"; then
            echo '::warning title=mls-rs-RustSec-warning::RustSec findings, including allowed maintenance warnings, remain visible and are not production/security clearance.'
            {
              echo '## RustSec findings in unreleased mls-rs feasibility lane'
              echo 'The report is retained below; this test-only result does not treat any warning as cleared.'
              grep -E 'Crate:|Version:|Warning:|Title:|ID:|URL:|warning found' "$RUNNER_TEMP/mls-rs-audit.log"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if (( result != 0 )); then
            details="$(tail -n 40 "$RUNNER_TEMP/mls-rs-audit.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=mls-rs-RustSec-audit::$details"
          fi
          exit "$result"

      - name: Locate Android SDK command-line tools
        id: android_sdk
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            for candidate in "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "$sdk_root/tools/bin/sdkmanager"; do
              if [[ -x "$candidate" ]]; then sdkmanager="$candidate"; break; fi
            done
          fi
          if [[ -z "$sdkmanager" ]]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
            echo "::error::Android sdkmanager was not found under $sdk_root"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_MANAGER=$sdkmanager" >> "$GITHUB_ENV"

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        id: install_ndk
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          license_answers="$(mktemp)"
          trap 'rm -f "$license_answers"' EXIT
          for _ in {1..100}; do printf 'y\n' >> "$license_answers"; done
          "$ANDROID_SDK_MANAGER" --sdk_root="$ANDROID_HOME" --licenses < "$license_answers" >/dev/null
          "$ANDROID_SDK_MANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;${ANDROID_NDK_VERSION}"
          test -x "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Android emulator and API 35 system image
        id: setup_emulator
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_MANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" "platforms;android-35" "emulator" \
            "system-images;android-35;google_apis;x86_64"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$(dirname "$ANDROID_SDK_MANAGER")/avdmanager"

      - name: Build mls-rs JNI library and standalone APK for all Android ABIs
        id: candidate_android_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SECRET_MESSAGE_NATIVE_DIR="$GITHUB_WORKSPACE/secretmessage/native-mls-rs" \
          SECRET_MESSAGE_CRYPTO_LABEL="mls-rs/AWS-LC" \
            bash secretmessage/android-smoke/build-android-smoke.sh 2>&1 \
            | tee "$RUNNER_TEMP/mls-rs-android-build.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            details="$(tail -n 40 "$RUNNER_TEMP/mls-rs-android-build.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=mls-rs-Android-build::$details"
          fi
          exit "$result"

      - name: Execute mls-rs JNI smoke APK in Android emulator
        id: candidate_emulator
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: bash secretmessage/android-smoke/run-on-emulator.sh

      - name: Upload mls-rs test-only APK
        id: upload_candidate_apk
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secretmessage-mls-rs-candidate-test-only
          path: secretmessage/android-smoke/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mls-rs candidate lockfile and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secretmessage-mls-rs-candidate-review
          path: |
            secretmessage/native-mls-rs/Cargo.lock
            ${{ runner.temp }}/mls-rs-*.log
            ${{ runner.temp }}/mls-rs-*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Report mls-rs candidate outcomes
        id: candidate_gate
        if: always()
        env:
          LOCK: ${{ steps.candidate_lock.outcome }}
          FORMAT: ${{ steps.candidate_format.outcome }}
          HOST_TEST: ${{ steps.candidate_test.outcome }}
          CLIPPY: ${{ steps.candidate_clippy.outcome }}
          JNI_CHECK: ${{ steps.candidate_jni_check.outcome }}
          DEPENDENCY_GRAPH: ${{ steps.candidate_graph.outcome }}
          RUSTSEC_AUDIT: ${{ steps.candidate_rustsec.outcome }}
          ANDROID_SDK: ${{ steps.android_sdk.outcome }}
          NDK: ${{ steps.install_ndk.outcome }}
          EMULATOR_SDK: ${{ steps.setup_emulator.outcome }}
          ANDROID_BUILD: ${{ steps.candidate_android_build.outcome }}
          ANDROID_EMULATOR: ${{ steps.candidate_emulator.outcome }}
          APK_UPLOAD: ${{ steps.upload_candidate_apk.outcome }}
        shell: bash
        run: |
          set -u
          failed=()
          for check in \
            "Pinned mls-rs/AWS-LC lockfile=$LOCK" \
            "Formatting=$FORMAT" \
            "In-memory MLS fixture=$HOST_TEST" \
            "Clippy=$CLIPPY" \
            "JNI host check=$JNI_CHECK" \
            "Android dependency graph=$DEPENDENCY_GRAPH" \
            "RustSec audit=$RUSTSEC_AUDIT" \
            "Android SDK=$ANDROID_SDK" \
            "Android NDK=$NDK" \
            "Android emulator image=$EMULATOR_SDK" \
            "Four-ABI JNI APK build=$ANDROID_BUILD" \
            "Hosted Android emulator smoke=$ANDROID_EMULATOR" \
            "Test-only APK upload=$APK_UPLOAD"; do
            name="${check%%=*}"
            outcome="${check#*=}"
            printf '| %s | %s |\n' "$name" "$outcome" >> "$GITHUB_STEP_SUMMARY"
            printf '%-34s %s\n' "$name" "$outcome"
            if [[ "$outcome" != success ]]; then failed+=("$name: $outcome"); fi
          done
          if ((${#failed[@]})); then
            echo '## mls-rs candidate: NOT CLEARED' >> "$GITHUB_STEP_SUMMARY"
            details="$(printf '%s; ' "${failed[@]}")"
            details="${details%; }"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=mls-rs-candidate-blocked::$details"
            exit 1
          fi
          {
            echo '## mls-rs candidate: test-only checks passed'
            echo 'Upstream explicitly states this implementation has not received a full third-party security audit. This is not an independent audit, physical-device test, or production/security approval.'
            if grep -Eq 'warning found|RUSTSEC-[0-9]{4}-[0-9]+' "$RUNNER_TEMP/mls-rs-audit.log" 2>/dev/null; then
              echo 'RustSec findings remain visible in the audit summary above and are not treated as cleared.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
