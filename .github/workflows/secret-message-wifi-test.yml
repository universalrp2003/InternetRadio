# Secret Message app (secretmessage/wifi-test): the WhisperPad product screens connected to another
# phone through the mls-rs/AWS-LC session, over the Internet through the owner's relay or directly on
# the same Wi-Fi. It began as the owner-approved test builds of 17 October 2026; that day the owner
# chose to publish it without an independent security review, with a private signing key.
#
# Every run builds and checks the debug APK (com.rpideas.secretmessage.debug) and the unsigned
# release APK. Once secretmessage/signing/secretmessage-release.p12 exists, the release APK is signed
# with it (password: the SECRETMESSAGE_SIGNING_PASSWORD secret) and checked against the pinned
# certificate, and the emulator smoke runs on that signed APK. Publication happens only for a push to
# the authorized branch whose commit contains [publish-secretmessage], only after every build and
# check passed, and never overwrites an existing tag.
name: Secret Message app (build, sign and publish)

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "secretmessage/wifi-test/**"
      - "secretmessage/product/src/main/**"
      - "secretmessage/native-mls-rs/**"
      - ".github/workflows/secret-message-wifi-test.yml"
  pull_request:
    paths:
      - "secretmessage/wifi-test/**"
      - "secretmessage/product/src/main/**"
      - "secretmessage/native-mls-rs/**"
      - ".github/workflows/secret-message-wifi-test.yml"
  workflow_dispatch:

permissions:
  contents: read

# Ordinary pushes replace each other's runs; a publishing run is never cancelled by a later push.
concurrency:
  group: secret-message-app-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[publish-secretmessage]') && 'publish' || 'build' }}
  cancel-in-progress: ${{ !contains(github.event.head_commit.message, '[publish-secretmessage]') }}

env:
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_API_LEVEL: "26"
  # Raise these with versionCode/versionName in secretmessage/wifi-test/app/build.gradle.kts.
  EXPECTED_VERSION: "1.1.0"
  EXPECTED_CODE: "2"
  RELEASE_PACKAGE: "com.rpideas.secretmessage"

jobs:
  wifi-test-apk:
    name: Build, check and sign Secret Message
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH_REQUESTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/arena/d4fb2344-internetradio' && contains(github.event.head_commit.message, '[publish-secretmessage]') }}
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      artifact: ${{ steps.sign.outputs.artifact }}
      asset: ${{ steps.sign.outputs.asset }}
      tag: ${{ steps.sign.outputs.tag }}
      version: ${{ steps.sign.outputs.version }}
      size: ${{ steps.sign.outputs.size }}
      sha256: ${{ steps.sign.outputs.sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests and compile the app before the native build
        shell: bash
        run: |
          set +e
          ./gradlew -p secretmessage/wifi-test --no-daemon :app:testDebugUnitTest :app:compileDebugKotlin 2>&1 \
            | tee "$RUNNER_TEMP/wifi-test-compile.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            python3 - "$RUNNER_TEMP/wifi-test-compile.log" <<'PY'
          import re
          import sys

          log = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          picked = [line.replace("file:///home/runner/work/InternetRadio/InternetRadio/", "")
                    for line in log if line.startswith("e: ")][:60]
          for index, line in enumerate(log):
              if re.search(r"\bFAILED$", line) and " > " in line:
                  picked.extend(log[index:index + 4])
              if line.startswith("* What went wrong"):
                  picked.extend(log[index:index + 8])
          picked.extend(log[-15:])
          text = "\n".join(picked)
          for start in range(0, min(len(text), 3500 * 6), 3500):
              chunk = text[start:start + 3500].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=wifi-test-compile::{chunk}")
          PY
          fi
          exit "$result"

      - name: Summarize unit-test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob("secretmessage/wifi-test/app/build/test-results/testDebugUnitTest/*.xml"))
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, "0"))
          print(
              f"::notice title=wifi-test-unit-tests::{totals['tests']} tests in {len(reports)} classes; "
              f"{totals['failures']} failures, {totals['errors']} errors, {totals['skipped']} skipped."
          )
          PY

      - name: Set up Rust 1.94.0 and Android targets
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Locate the Android SDK and install NDK ${{ env.ANDROID_NDK_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
            echo "::error::Android sdkmanager was not found under $sdk_root"
            exit 1
          fi
          yes 2>/dev/null | head -n 100 | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --sdk_root="$sdk_root" --install "ndk;${ANDROID_NDK_VERSION}" > "$RUNNER_TEMP/ndk-install.log" 2>&1 \
            || { tail -n 40 "$RUNNER_TEMP/ndk-install.log"; exit 1; }
          test -x "$sdk_root/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_SDK_MANAGER=$sdkmanager"
            echo "ANDROID_NDK_HOME=$sdk_root/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Build the JNI library for four ABIs, the debug APK and the unsigned release APK
        id: build
        shell: bash
        run: |
          set +e
          bash secretmessage/wifi-test/build-wifi-test.sh 2>&1 | tee "$RUNNER_TEMP/wifi-test-build.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            details="$(grep -E '^(e: |error|Error|FAIL|Unexpected|Expected|Found|The APK|.*lacks JNI|.*is missing)' "$RUNNER_TEMP/wifi-test-build.log" | head -n 40)"
            details+=$'\n'"$(tail -n 30 "$RUNNER_TEMP/wifi-test-build.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=wifi-test-build::$details"
          fi
          exit "$result"

      - name: Report the debug APK
        shell: bash
        env:
          APK_VERSION: ${{ steps.build.outputs.version }}
          APK_SIZE: ${{ steps.build.outputs.size }}
          APK_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          echo "::notice title=secretmessage-debug-apk::Debug APK (com.rpideas.secretmessage.debug) for version $APK_VERSION, $APK_SIZE bytes, SHA-256 $APK_SHA256. Not for release."
          {
            echo '### Secret Message debug APK'
            echo "- Version: \`$APK_VERSION\` (debug package com.rpideas.secretmessage.debug)"
            echo "- Size: $APK_SIZE bytes"
            echo "- SHA-256: \`$APK_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: secretmessage-debug-apk-${{ github.run_number }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secretmessage-wifi-test-lint-${{ github.run_number }}
          path: secretmessage/wifi-test/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Sign the release APK with the project key and check it
        id: sign
        shell: bash
        env:
          PASSWORD: ${{ secrets.SECRETMESSAGE_SIGNING_PASSWORD }}
          UNSIGNED: ${{ steps.build.outputs.release_unsigned }}
        run: |
          set -euo pipefail
          keystore="secretmessage/signing/secretmessage-release.p12"
          pin="secretmessage/signing/certificate-sha256.txt"
          # A pasted secret can end with a line break; it is never part of the password.
          PASSWORD="$(printf '%s' "$PASSWORD" | tr -d '\r\n')"
          if [[ ! -f "$keystore" || ! -f "$pin" || -z "$PASSWORD" ]]; then
            if [[ "$PUBLISH_REQUESTED" == true ]]; then
              echo "::error title=secretmessage-release::Publication needs the release key ($keystore, $pin) and the SECRETMESSAGE_SIGNING_PASSWORD secret."
              exit 1
            fi
            echo "::notice title=secretmessage-release::No release key or password yet; only the debug APK was checked."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export PASSWORD
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          test -x "$zipalign" && test -x "$apksigner" && test -x "$aapt"
          asset="Secret-Message-v${EXPECTED_VERSION}.apk"
          out_dir="$RUNNER_TEMP/secretmessage-release"
          mkdir -p "$out_dir"
          aligned="$RUNNER_TEMP/secretmessage-aligned.apk"
          # Uncompressed native libraries stay aligned to 16 KB pages (Android 15 devices with 16 KB pages).
          "$zipalign" -P 16 -f 4 "$UNSIGNED" "$aligned" 2>/dev/null || "$zipalign" -p -f 4 "$UNSIGNED" "$aligned"
          "$apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias secretmessage \
            --ks-pass env:PASSWORD --key-pass env:PASSWORD --out "$out_dir/$asset" "$aligned"
          apk="$out_dir/$asset"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/secretmessage-signature.txt"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/secretmessage-signature.txt"
          signer="$(sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/secretmessage-signature.txt" | tr -d ' :\r' | tr 'A-F' 'a-f' | sort -u)"
          expected_signer="$(tr -d ' :\r\n' < "$pin" | tr 'A-F' 'a-f')"
          if [[ -z "$signer" || "$signer" != "$expected_signer" ]]; then
            echo "::error title=secretmessage-release::The signed APK's certificate ($signer) is not the pinned release certificate ($expected_signer)."
            exit 1
          fi
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/secretmessage-badging.txt"
          grep -Fq "package: name='${RELEASE_PACKAGE}' versionCode='${EXPECTED_CODE}' versionName='${EXPECTED_VERSION}'" "$RUNNER_TEMP/secretmessage-badging.txt" || {
            echo "::error title=secretmessage-release::Unexpected package or version: $(head -n 1 "$RUNNER_TEMP/secretmessage-badging.txt")"
            exit 1
          }
          if grep -q "application-debuggable" "$RUNNER_TEMP/secretmessage-badging.txt"; then
            echo "::error title=secretmessage-release::The release APK is marked debuggable."
            exit 1
          fi
          grep -Eq "sdkVersion:'26'" "$RUNNER_TEMP/secretmessage-badging.txt" || {
            echo "::error title=secretmessage-release::The release APK's minimum SDK is not API 26."
            exit 1
          }
          size="$(stat -c %s "$apk")"
          sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          {
            echo "signed=true"
            echo "apk=$apk"
            echo "artifact=secretmessage-release-apk-${GITHUB_RUN_NUMBER}"
            echo "asset=$asset"
            echo "tag=secret-message-v${EXPECTED_VERSION}"
            echo "version=$EXPECTED_VERSION"
            echo "size=$size"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=secretmessage-release-apk::$asset (${RELEASE_PACKAGE} ${EXPECTED_VERSION} / code ${EXPECTED_CODE}), $size bytes, SHA-256 $sha256, signer certificate SHA-256 $signer. Publish requested: $PUBLISH_REQUESTED."
          {
            echo '### Secret Message signed release APK'
            echo "- $asset: ${RELEASE_PACKAGE} ${EXPECTED_VERSION} / code ${EXPECTED_CODE}"
            echo "- Size: $size bytes"
            echo "- SHA-256: \`$sha256\`"
            echo "- Signing certificate SHA-256: \`$signer\`"
            echo "- Publish requested: $PUBLISH_REQUESTED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the signed release APK
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.sign.outputs.artifact }}
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Launch and exercise the app in an Android 15 emulator
        timeout-minutes: 15
        shell: bash
        run: bash secretmessage/wifi-test/run-wifi-test-on-emulator.sh "${{ steps.sign.outputs.apk || steps.build.outputs.apk }}"

  publish:
    name: Publish the verified release APK on both release pages
    needs: wifi-test-apk
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/arena/d4fb2344-internetradio' &&
      contains(github.event.head_commit.message, '[publish-secretmessage]') &&
      needs.wifi-test-apk.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SOURCE_REPO: universalrp2003/InternetRadio
      TARGET_REPO: universalrp2003/RP-Android-Apps
      TAG: ${{ needs.wifi-test-apk.outputs.tag }}
      ASSET: ${{ needs.wifi-test-apk.outputs.asset }}
      VERSION: ${{ needs.wifi-test-apk.outputs.version }}
      EXPECTED_SIZE: ${{ needs.wifi-test-apk.outputs.size }}
      EXPECTED_SHA256: ${{ needs.wifi-test-apk.outputs.sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download the signed release APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.wifi-test-apk.outputs.artifact }}
          path: ${{ runner.temp }}/secretmessage-release

      - name: Check the downloaded APK and the release notes
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/secretmessage-release/$ASSET"
          notes="secretmessage/releases/secret-message-v${VERSION}.md"
          test -s "$apk" && test -s "$notes"
          [[ "$(stat -c %s "$apk")" == "$EXPECTED_SIZE" ]]
          [[ "$(sha256sum "$apk" | cut -d ' ' -f 1)" == "$EXPECTED_SHA256" ]]
          {
            echo "APK=$apk"
            echo "NOTES=$notes"
          } >> "$GITHUB_ENV"

      - name: Preflight both official repositories and the release tag
        shell: bash
        env:
          SOURCE_TOKEN: ${{ github.token }}
          TARGET_TOKEN: ${{ secrets.RP_ANDROID_APPS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TARGET_TOKEN" ]]; then
            echo "::error::RP_ANDROID_APPS_RELEASE_TOKEN is missing; no release was created."
            exit 1
          fi
          GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPO" --jq '.full_name'
          GH_TOKEN="$TARGET_TOKEN" gh api "repos/$TARGET_REPO" --jq '.full_name'
          destination_branch="$(GH_TOKEN="$TARGET_TOKEN" gh api "repos/$TARGET_REPO" --jq '.default_branch')"
          if [[ -z "$destination_branch" ]]; then
            echo "::error::Could not determine the destination repository's default branch."
            exit 1
          fi
          for repo in "$SOURCE_REPO" "$TARGET_REPO"; do
            if [[ "$repo" == "$SOURCE_REPO" ]]; then token="$SOURCE_TOKEN"; else token="$TARGET_TOKEN"; fi
            if GH_TOKEN="$token" gh release view "$TAG" --repo "$repo" >/dev/null 2>&1 || \
               GH_TOKEN="$token" gh api "repos/$repo/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Release or tag already exists at $repo/$TAG; refusing to overwrite it."
              exit 1
            fi
          done
          echo "destination_branch=$destination_branch" >> "$GITHUB_ENV"

      - name: Create both draft releases with the exact verified APK bytes
        shell: bash
        env:
          SOURCE_TOKEN: ${{ github.token }}
          TARGET_TOKEN: ${{ secrets.RP_ANDROID_APPS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          title="Secret Message $VERSION"
          # Drafts first, with the same commands as the published Oor Arivippu releases.
          GH_TOKEN="$TARGET_TOKEN" gh release create "$TAG" --repo "$TARGET_REPO" \
            --target "$destination_branch" --draft --title "$title" --notes-file "$NOTES"
          GH_TOKEN="$TARGET_TOKEN" gh release upload "$TAG" "$APK" --repo "$TARGET_REPO"
          GH_TOKEN="$SOURCE_TOKEN" gh release create "$TAG" --repo "$SOURCE_REPO" \
            --target "$GITHUB_SHA" --draft --title "$title" --notes-file "$NOTES"
          GH_TOKEN="$SOURCE_TOKEN" gh release upload "$TAG" "$APK" --repo "$SOURCE_REPO"

      - name: Verify both draft assets before publication
        shell: bash
        env:
          SOURCE_TOKEN: ${{ github.token }}
          TARGET_TOKEN: ${{ secrets.RP_ANDROID_APPS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          verify() {
            local repo="$1" token="$2" draft="$3"
            local response="$RUNNER_TEMP/${repo##*/}-${TAG}-${draft}.json"
            GH_TOKEN="$token" gh api --paginate "repos/$repo/releases?per_page=100" > "$response"
            python3 secretmessage/wifi-test/verify-release-asset.py "$response" "$repo" "$TAG" "$ASSET" "$APK" \
              "$EXPECTED_SIZE" "$EXPECTED_SHA256" "$draft"
          }
          verify "$TARGET_REPO" "$TARGET_TOKEN" true
          verify "$SOURCE_REPO" "$SOURCE_TOKEN" true

      - name: Publish the destination release, then the source fallback
        shell: bash
        env:
          SOURCE_TOKEN: ${{ github.token }}
          TARGET_TOKEN: ${{ secrets.RP_ANDROID_APPS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          GH_TOKEN="$TARGET_TOKEN" gh release edit "$TAG" --repo "$TARGET_REPO" --draft=false
          GH_TOKEN="$SOURCE_TOKEN" gh release edit "$TAG" --repo "$SOURCE_REPO" --draft=false

      - name: Verify both public releases and their asset digests
        shell: bash
        env:
          SOURCE_TOKEN: ${{ github.token }}
          TARGET_TOKEN: ${{ secrets.RP_ANDROID_APPS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          for repo in "$TARGET_REPO" "$SOURCE_REPO"; do
            if [[ "$repo" == "$TARGET_REPO" ]]; then token="$TARGET_TOKEN"; else token="$SOURCE_TOKEN"; fi
            response="$RUNNER_TEMP/${repo##*/}-${TAG}-public.json"
            GH_TOKEN="$token" gh api --paginate "repos/$repo/releases?per_page=100" > "$response"
            python3 secretmessage/wifi-test/verify-release-asset.py "$response" "$repo" "$TAG" "$ASSET" "$APK" \
              "$EXPECTED_SIZE" "$EXPECTED_SHA256" false
          done
          echo "::notice title=secretmessage-published::$TAG published on $TARGET_REPO and $SOURCE_REPO: $ASSET, $EXPECTED_SIZE bytes, SHA-256 $EXPECTED_SHA256."
          {
            echo "### Secret Message $VERSION published and verified"
            echo "- Asset: $ASSET ($EXPECTED_SIZE bytes)"
            echo "- SHA-256: $EXPECTED_SHA256"
            echo "- https://github.com/$TARGET_REPO/releases/tag/$TAG"
            echo "- https://github.com/$SOURCE_REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
