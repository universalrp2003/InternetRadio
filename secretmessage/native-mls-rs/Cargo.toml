[package]
name = "secretmessage-mls-rs-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "GPL-3.0-only"
publish = false

[lib]
name = "secretmessage_mls_spike"
crate-type = ["cdylib", "rlib"]

[features]
default = []
spike-harness = []
android-jni = ["dep:jni", "spike-harness"]
# Separate persistence experiment; excluded from the standard Android JNI/product feature set.
storage-spike = ["spike-harness", "mls-rs/sqlcipher-bundled", "dep:rusqlite"]

[dependencies]
mls-rs = { version = "=0.56.0", default-features = false, features = ["std", "rfc_compliant"] }
mls-rs-core = { version = "=0.27.0", default-features = false, features = ["std"] }
mls-rs-crypto-awslc = { version = "=0.25.0", default-features = false, features = ["non-fips"] }
# Use the upstream in-process bindgen path for Android cross-compilation.
aws-lc-rs = { version = "=1.16.3", default-features = false, features = ["alloc", "non-fips", "bindgen"] }
jni = { version = "=0.22.4", optional = true }
# SQLCipher's bundled amalgamation needs OpenSSL headers; vendor the upstream OpenSSL source only in this isolated storage experiment.
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"], optional = true }
